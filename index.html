<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>量子漫游者 · 星际导航终端</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --metal-dark: #0a0f1a;
            --metal-mid: #141b2d;
            --metal-light: #1e293b;
            --metal-edge: #334155;
            --cyber-cyan: #00e5ff;
            --cyber-blue: #2979ff;
            --cyber-orange: #ff9100;
            --cyber-green: #00e676;
            --cyber-red: #ff1744;
            --cyber-purple: #d500f9;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Share Tech Mono', 'JetBrains Mono', 'Courier New', monospace;
            background: #050810;
            color: #e0f7fa;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            margin: 0;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* CRT扫描线 */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(transparent 50%, rgba(0,0,0,0.08) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 9999;
        }
        /* 网格背景 */
        body::after {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(0,229,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,229,255,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
            mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
        }
        .ambient-glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            z-index: 0;
            pointer-events: none;
            animation: float 20s ease-in-out infinite;
        }
        @keyframes float {
            0%,100% { opacity: 0.4; transform: translate(0,0); }
            50% { opacity: 0.7; transform: translate(30px,-20px); }
        }
        /* 金属面板 */
        .metal-panel {
            position: relative;
            width: 100%;
            max-width: 480px;
            background: linear-gradient(145deg, var(--metal-mid) 0%, var(--metal-dark) 50%, #0d1322 100%);
            border: 2px solid var(--metal-edge);
            border-radius: 4px;
            box-shadow:
                0 25px 70px -10px rgba(0,0,0,0.95),
                0 0 0 1px rgba(255,255,255,0.03) inset,
                0 1px 0 0 rgba(255,255,255,0.08) inset,
                0 -2px 0 0 rgba(0,0,0,0.3) inset;
            z-index: 10;
            overflow: visible;
        }
        .metal-panel::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: repeating-linear-gradient(90deg, transparent 0, rgba(255,255,255,0.015) 1px, transparent 2px, transparent 4px);
            pointer-events: none;
        }
        /* HUD四角 */
        .hud-corner { position: absolute; width: 20px; height: 20px; border-color: var(--cyber-cyan); z-index: 20; }
        .hud-corner.tl { top:-2px; left:-2px; border-top:2px solid; border-left:2px solid; }
        .hud-corner.tr { top:-2px; right:-2px; border-top:2px solid; border-right:2px solid; }
        .hud-corner.bl { bottom:-2px; left:-2px; border-bottom:2px solid; border-left:2px solid; }
        .hud-corner.br { bottom:-2px; right:-2px; border-bottom:2px solid; border-right:2px solid; }
        /* 铆钉 */
        .rivet {
            position: absolute;
            width: 10px; height: 10px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #475569 0%, #1e293b 50%, #0f172a 100%);
            box-shadow: 0 1px 2px rgba(0,0,0,0.8), inset 0 1px 1px rgba(255,255,255,0.1);
            z-index: 15;
        }
        .rivet::after {
            content:''; position:absolute; top:50%; left:50%; width:4px; height:1px;
            background:rgba(0,0,0,0.5); transform:translate(-50%,-50%) rotate(45deg);
        }
        /* 头部 */
        .panel-header {
            position: relative;
            padding: 14px 20px;
            background: linear-gradient(180deg, rgba(0,229,255,0.08) 0%, transparent 100%);
            border-bottom: 1px solid rgba(0,229,255,0.2);
        }
        .panel-title {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 1.3rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            background: linear-gradient(180deg, #fff 0%, var(--cyber-cyan) 50%, #00b8d4 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 10px rgba(0,229,255,0.5);
        }
        .panel-subtitle {
            font-size: 0.6rem; letter-spacing: 0.3em;
            color: rgba(0,229,255,0.6); text-transform: uppercase;
        }
        /* LED指示灯 */
        .led { display:flex; align-items:center; gap:8px; font-family:'Orbitron',sans-serif; font-size:0.65rem; letter-spacing:0.1em; text-transform:uppercase; }
        .led-light { width:12px; height:12px; border-radius:50%; position:relative; border:1px solid rgba(0,0,0,0.5); }
        .led-light::before { content:''; position:absolute; top:2px; left:2px; width:4px; height:4px; border-radius:50%; background:rgba(255,255,255,0.8); }
        .led-light.off { background:#1a1a1a; box-shadow:inset 0 1px 3px rgba(0,0,0,0.9); }
        .led-light.green {
            background: radial-gradient(circle at 50% 50%, #69f0ae 0%, var(--cyber-green) 40%, #00a152 100%);
            box-shadow: inset 0 -1px 2px rgba(0,0,0,0.3), 0 0 8px var(--cyber-green), 0 0 16px rgba(0,230,118,0.5);
            animation: pulseGreen 2s ease-in-out infinite;
        }
        .led-light.red {
            background: radial-gradient(circle at 50% 50%, #ff5252 0%, var(--cyber-red) 40%, #b71c1c 100%);
            box-shadow: inset 0 -1px 2px rgba(0,0,0,0.3), 0 0 8px var(--cyber-red), 0 0 16px rgba(255,23,68,0.5);
            animation: pulseRed 1.5s ease-in-out infinite;
        }
        .led-light.orange {
            background: radial-gradient(circle at 50% 50%, #ffd180 0%, var(--cyber-orange) 40%, #e65100 100%);
            box-shadow: inset 0 -1px 2px rgba(0,0,0,0.3), 0 0 8px var(--cyber-orange), 0 0 16px rgba(255,145,0,0.5);
            animation: pulseOrange 1.5s ease-in-out infinite;
        }
        .led-light.blue {
            background: radial-gradient(circle at 50% 50%, #82b1ff 0%, var(--cyber-blue) 40%, #0d47a1 100%);
            box-shadow: inset 0 -1px 2px rgba(0,0,0,0.3), 0 0 8px var(--cyber-blue), 0 0 16px rgba(41,121,255,0.5);
            animation: pulseBlue 1.8s ease-in-out infinite;
        }
        @keyframes pulseGreen { 0%,100%{box-shadow:inset 0 -1px 2px rgba(0,0,0,0.3),0 0 8px var(--cyber-green),0 0 16px rgba(0,230,118,0.5)} 50%{box-shadow:inset 0 -1px 2px rgba(0,0,0,0.3),0 0 12px var(--cyber-green),0 0 24px rgba(0,230,118,0.7)} }
        @keyframes pulseRed { 0%,100%{box-shadow:inset 0 -1px 2px rgba(0,0,0,0.3),0 0 8px var(--cyber-red),0 0 16px rgba(255,23,68,0.5)} 50%{box-shadow:inset 0 -1px 2px rgba(0,0,0,0.3),0 0 12px var(--cyber-red),0 0 24px rgba(255,23,68,0.7)} }
        @keyframes pulseOrange { 0%,100%{box-shadow:inset 0 -1px 2px rgba(0,0,0,0.3),0 0 8px var(--cyber-orange),0 0 16px rgba(255,145,0,0.5)} 50%{box-shadow:inset 0 -1px 2px rgba(0,0,0,0.3),0 0 12px var(--cyber-orange),0 0 24px rgba(255,145,0,0.7)} }
        @keyframes pulseBlue { 0%,100%{box-shadow:inset 0 -1px 2px rgba(0,0,0,0.3),0 0 8px var(--cyber-blue),0 0 16px rgba(41,121,255,0.5)} 50%{box-shadow:inset 0 -1px 2px rgba(0,0,0,0.3),0 0 12px var(--cyber-blue),0 0 24px rgba(41,121,255,0.7)} }
        /* 金属按钮 */
        .metal-btn {
            position: relative;
            width: 100%;
            padding: 18px 24px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            font-size: 0.85rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: #fff;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            overflow: hidden;
            transition: all 0.15s cubic-bezier(0.4,0,0.2,1);
            user-select: none;
            background: linear-gradient(180deg, #00b8d4 0%, #0097a7 20%, #00838f 50%, #006064 80%, #004d54 100%);
            box-shadow:
                0 0 20px rgba(0,184,212,0.4),
                0 6px 20px rgba(0,0,0,0.6),
                0 8px 0 #003840,
                0 10px 15px rgba(0,0,0,0.5),
                inset 0 2px 0 rgba(255,255,255,0.3),
                inset 0 4px 8px rgba(255,255,255,0.15),
                inset 0 -2px 4px rgba(0,0,0,0.3),
                inset 0 0 0 1px rgba(0,229,255,0.5);
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }
        .metal-btn::before {
            content:''; position:absolute; top:0; left:-100%; width:100%; height:100%;
            background:linear-gradient(90deg,transparent,rgba(255,255,255,0.3),transparent);
            transition:left 0.6s ease;
        }
        .metal-btn:hover::before { left:100%; }
        .metal-btn:hover {
            background: linear-gradient(180deg, #00e5ff 0%, #00bcd4 20%, #00acc1 50%, #00838f 80%, #006064 100%);
            box-shadow:
                0 0 35px rgba(0,229,255,0.6),
                0 8px 25px rgba(0,0,0,0.5),
                0 8px 0 #003840,
                0 12px 20px rgba(0,0,0,0.4),
                inset 0 2px 0 rgba(255,255,255,0.4),
                inset 0 4px 10px rgba(255,255,255,0.2),
                inset 0 -2px 4px rgba(0,0,0,0.3),
                inset 0 0 0 1px rgba(0,229,255,0.7);
            transform: translateY(-2px);
        }
        .metal-btn:active {
            transform: translateY(4px);
            box-shadow:
                0 0 15px rgba(0,184,212,0.3),
                0 2px 5px rgba(0,0,0,0.5),
                0 2px 0 #003840,
                inset 0 2px 8px rgba(0,0,0,0.4),
                inset 0 -1px 0 rgba(255,255,255,0.1),
                inset 0 0 0 1px rgba(0,229,255,0.4);
        }
        .metal-btn:disabled {
            background: linear-gradient(180deg, #37474f 0%, #263238 50%, #1c2529 100%);
            box-shadow: 0 2px 5px rgba(0,0,0,0.5), 0 4px 0 #12181b, inset 0 1px 0 rgba(255,255,255,0.1), inset 0 -1px 2px rgba(0,0,0,0.4);
            color: rgba(255,255,255,0.4);
            cursor:not-allowed; transform:none; text-shadow:none;
        }
        .metal-btn:disabled::before { display:none; }
        /* 导航按钮绿色 */
        .metal-btn-nav {
            position: relative;
            width: 100%;
            padding: 16px 20px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 0.75rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #fff;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            overflow: hidden;
            transition: all 0.15s cubic-bezier(0.4,0,0.2,1);
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: linear-gradient(180deg, #00e676 0%, #00c853 20%, #00a844 50%, #007e33 80%, #005f26 100%);
            box-shadow:
                0 0 15px rgba(0,230,118,0.3),
                0 5px 15px rgba(0,0,0,0.5),
                0 6px 0 #004419,
                0 8px 12px rgba(0,0,0,0.4),
                inset 0 2px 0 rgba(255,255,255,0.25),
                inset 0 3px 6px rgba(255,255,255,0.1),
                inset 0 -2px 3px rgba(0,0,0,0.3),
                inset 0 0 0 1px rgba(0,230,118,0.4);
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }
        .metal-btn-nav::before {
            content:''; position:absolute; top:0; left:-100%; width:100%; height:100%;
            background:linear-gradient(90deg,transparent,rgba(255,255,255,0.25),transparent);
            transition:left 0.6s ease;
        }
        .metal-btn-nav:hover::before { left:100%; }
        .metal-btn-nav:hover {
            background: linear-gradient(180deg, #69f0ae 0%, #00e676 20%, #00c853 50%, #00a844 80%, #007e33 100%);
            box-shadow:
                0 0 25px rgba(0,230,118,0.5),
                0 7px 20px rgba(0,0,0,0.4),
                0 6px 0 #004419,
                0 10px 18px rgba(0,0,0,0.35),
                inset 0 2px 0 rgba(255,255,255,0.35),
                inset 0 4px 8px rgba(255,255,255,0.15),
                inset 0 -2px 3px rgba(0,0,0,0.3),
                inset 0 0 0 1px rgba(0,230,118,0.6);
            transform: translateY(-2px);
        }
        .metal-btn-nav:active {
            transform: translateY(3px);
            box-shadow:
                0 0 10px rgba(0,230,118,0.2),
                0 2px 4px rgba(0,0,0,0.5),
                0 2px 0 #004419,
                inset 0 2px 6px rgba(0,0,0,0.4),
                inset 0 -1px 0 rgba(255,255,255,0.08);
        }
        /* 内凹金属输入框 */
        .metal-sunken {
            width: 100%;
            background: linear-gradient(180deg, #060a12 0%, #0a0f1a 100%);
            border: 1px solid #0f172a;
            border-top-color: #030712;
            border-left-color: #030712;
            border-right-color: #1e293b;
            border-bottom-color: #1e293b;
            border-radius: 2px;
            padding: 14px 40px 14px 16px;
            color: var(--cyber-cyan);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
            box-shadow: 
                inset 0 3px 8px rgba(0,0,0,0.7),
                inset 0 0 0 1px rgba(0,0,0,0.5),
                0 1px 0 rgba(255,255,255,0.05);
            outline: none;
            transition: all 0.2s ease;
            appearance: none;
            -webkit-appearance: none;
        }
        .metal-sunken:focus {
            border-color: var(--cyber-cyan);
            box-shadow:
                inset 0 3px 8px rgba(0,0,0,0.6),
                inset 0 0 0 1px rgba(0,229,255,0.3),
                0 0 12px rgba(0,229,255,0.2),
                0 0 0 1px rgba(0,229,255,0.1);
        }
        .metal-sunken::placeholder { color: rgba(0,229,255,0.3); }
        /* 自定义下拉选择器 */
        .custom-select {
            position: relative;
            width: 100%;
        }
        .select-trigger {
            width: 100%;
            background: linear-gradient(180deg, #060a12 0%, #0a0f1a 100%);
            border: 1px solid #0f172a;
            border-top-color: #030712;
            border-left-color: #030712;
            border-right-color: #1e293b;
            border-bottom-color: #1e293b;
            border-radius: 2px;
            padding: 14px 40px 14px 16px;
            color: var(--cyber-cyan);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
            box-shadow: 
                inset 0 3px 8px rgba(0,0,0,0.7),
                inset 0 0 0 1px rgba(0,0,0,0.5),
                0 1px 0 rgba(255,255,255,0.05);
            outline: none;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
            user-select: none;
        }
        .select-trigger:hover {
            border-color: rgba(0,229,255,0.4);
        }
        .select-trigger.active {
            border-color: var(--cyber-cyan);
            box-shadow:
                inset 0 3px 8px rgba(0,0,0,0.6),
                inset 0 0 0 1px rgba(0,229,255,0.3),
                0 0 12px rgba(0,229,255,0.2),
                0 0 0 1px rgba(0,229,255,0.1);
        }
        .select-arrow-svg {
            transition: transform 0.25s cubic-bezier(0.4,0,0.2,1);
            color: var(--cyber-cyan);
            flex-shrink: 0;
        }
        .select-trigger.active .select-arrow-svg {
            transform: rotate(180deg);
        }
        .select-dropdown {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            right: 0;
            background: linear-gradient(180deg, #0a0f1a 0%, #070b14 100%);
            border: 1px solid var(--cyber-cyan);
            border-radius: 2px;
            box-shadow:
                0 12px 40px rgba(0,0,0,0.9),
                0 0 20px rgba(0,229,255,0.15),
                inset 0 1px 0 rgba(255,255,255,0.05),
                inset 0 0 0 1px rgba(0,229,255,0.1);
            z-index: 100;
            overflow: hidden;
            opacity: 0;
            transform: translateY(-8px) scale(0.98);
            pointer-events: none;
            transition: all 0.2s cubic-bezier(0.2,0.8,0.2,1);
            backdrop-filter: blur(10px);
        }
        .select-dropdown.show {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }
        /* 下拉面板顶部光条 */
        .select-dropdown::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, transparent, var(--cyber-cyan), transparent);
            animation: barPulse 2s ease-in-out infinite;
        }
        /* 下拉面板扫描线 */
        .select-dropdown::after {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,229,255,0.015) 2px, rgba(0,229,255,0.015) 4px);
            pointer-events: none;
        }
        .select-option {
            padding: 12px 16px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            color: rgba(0,229,255,0.7);
            cursor: pointer;
            transition: all 0.12s ease;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            letter-spacing: 0.05em;
        }
        .select-option:not(:last-child) {
            border-bottom: 1px solid rgba(0,229,255,0.08);
        }
        .select-option:hover {
            background: linear-gradient(90deg, rgba(0,229,255,0.12) 0%, rgba(0,229,255,0.03) 100%);
            color: var(--cyber-cyan);
            padding-left: 20px;
            text-shadow: 0 0 8px rgba(0,229,255,0.5);
        }
        .select-option.selected {
            background: linear-gradient(90deg, rgba(0,229,255,0.18) 0%, rgba(0,229,255,0.05) 100%);
            color: #fff;
            text-shadow: 0 0 10px rgba(0,229,255,0.6);
        }
        .select-option.selected::after {
            content: '✓';
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 0.8rem;
            color: var(--cyber-cyan);
            text-shadow: 0 0 6px var(--cyber-cyan);
        }
        /* 标签样式 */
        .metal-label {
            display:flex; align-items:center; gap:6px;
            font-family:'Orbitron',sans-serif; font-size:0.6rem; font-weight:700;
            letter-spacing:0.2em; text-transform:uppercase;
            color: rgba(0,229,255,0.8); margin-bottom:8px;
        }
        /* 熵源按钮 */
        .entropy-btn {
            position: relative;
            background: linear-gradient(180deg, var(--metal-light) 0%, var(--metal-mid) 100%);
            border: 1px solid var(--metal-edge);
            border-top-color: #475569;
            border-radius: 2px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow:
                0 4px 10px rgba(0,0,0,0.4),
                0 2px 0 #0f172a,
                inset 0 1px 0 rgba(255,255,255,0.08),
                inset 0 -1px 0 rgba(0,0,0,0.2);
        }
        .entropy-btn:hover {
            border-color: rgba(0,229,255,0.5);
            box-shadow:
                0 5px 12px rgba(0,0,0,0.4),
                0 2px 0 #0f172a,
                inset 0 1px 0 rgba(255,255,255,0.1),
                0 0 10px rgba(0,229,255,0.2);
            transform: translateY(-1px);
        }
        .entropy-btn.selected {
            background: linear-gradient(180deg, rgba(0,184,212,0.15) 0%, rgba(0,131,143,0.1) 100%);
            border-color: var(--cyber-cyan);
            box-shadow:
                0 0 20px rgba(0,229,255,0.3),
                0 4px 10px rgba(0,0,0,0.4),
                0 2px 0 #0f172a,
                inset 0 1px 0 rgba(0,229,255,0.2),
                inset 0 0 20px rgba(0,229,255,0.05);
        }
        .entropy-btn.selected::before {
            content:''; position:absolute; top:0; left:0; right:0; height:2px;
            background: linear-gradient(90deg, transparent, var(--cyber-cyan), transparent);
            animation: barPulse 2s ease-in-out infinite;
        }
        @keyframes barPulse {
            0%,100% { opacity:0.5; }
            50% { opacity:1; box-shadow:0 0 10px var(--cyber-cyan); }
        }
        .entropy-name {
            font-family:'Orbitron',sans-serif; font-size:0.75rem; font-weight:700;
            letter-spacing:0.1em; color:#fff;
        }
        .source-status { font-family:'Orbitron',sans-serif; font-size:0.55rem; letter-spacing:0.1em; font-weight:600; }
        .status-idle { color:#64748b; }
        .status-ready { color: var(--cyber-blue); }
        .status-loading { color: var(--cyber-orange); animation: blink 0.8s infinite; }
        .status-success { color: var(--cyber-green); }
        .status-error { color: var(--cyber-red); }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.4} }
        /* 分隔线 */
        .hud-divider {
            height:1px; background:linear-gradient(90deg,transparent,var(--cyber-cyan),transparent);
            position:relative;
        }
        .hud-divider::before {
            content:''; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
            width:6px; height:6px; border-radius:50%;
            background:var(--cyber-cyan); box-shadow:0 0 8px var(--cyber-cyan);
        }
        /* 结果面板 */
        .display-screen {
            background: linear-gradient(180deg, #030710 0%, #060d1a 100%);
            border: 1px solid #0f172a;
            border-radius: 2px;
            padding: 16px;
            box-shadow:
                inset 0 2px 10px rgba(0,0,0,0.8),
                inset 0 0 0 1px rgba(0,229,255,0.1);
            position: relative;
            overflow: hidden;
        }
        .display-screen::after {
            content:''; position:absolute; inset:0;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,229,255,0.02) 2px, rgba(0,229,255,0.02) 4px);
            pointer-events: none;
        }
        .data-value {
            font-family:'JetBrains Mono',monospace; font-size:1.1rem; font-weight:700;
            color:var(--cyber-cyan); text-shadow:0 0 8px rgba(0,229,255,0.6);
            letter-spacing:0.05em;
        }
        .data-value-green {
            font-family:'Orbitron',sans-serif; font-size:1.5rem; font-weight:900;
            background: linear-gradient(180deg, #b9f6ca 0%, var(--cyber-green) 50%, #00c853 100%);
            -webkit-background-clip: text; background-clip: text; color: transparent;
            filter: drop-shadow(0 0 8px rgba(0,230,118,0.6));
        }
        .data-label {
            font-family:'Orbitron',sans-serif; font-size:0.5rem; letter-spacing:0.2em;
            text-transform:uppercase; color:rgba(0,229,255,0.5); margin-bottom:4px;
        }
        .data-divider { width:1px; background:linear-gradient(180deg,transparent,rgba(0,229,255,0.3),transparent); }
        /* 错误面板 */
        .alert-panel {
            background: linear-gradient(180deg, rgba(255,23,68,0.1) 0%, rgba(183,28,28,0.05) 100%);
            border: 1px solid rgba(255,23,68,0.4);
            border-left: 3px solid var(--cyber-red);
            border-radius: 2px;
            padding: 12px 16px;
            color: #ff8a80;
            font-size: 0.75rem;
            font-family: 'Share Tech Mono', monospace;
            letter-spacing: 0.03em;
            box-shadow: 0 0 15px rgba(255,23,68,0.15), inset 0 0 20px rgba(255,23,68,0.05);
            animation: alertShake 0.4s ease-out;
        }
        @keyframes alertShake {
            0%,100%{transform:translateX(0)} 25%{transform:translateX(-4px)} 75%{transform:translateX(4px)}
        }
        @keyframes resultReveal {
            from { opacity:0; transform:translateY(10px) scale(0.98); }
            to { opacity:1; transform:translateY(0) scale(1); }
        }
        .hidden { display:none !important; }
        /* 轨道粒子 */
        .orbit-ring {
            position: absolute;
            border: 1px dashed rgba(0,229,255,0.15);
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
        }
        .orbit-particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--cyber-cyan);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--cyber-cyan);
        }
        .orbit-particle.purple { background: var(--cyber-purple); box-shadow:0 0 8px var(--cyber-purple); }
        .metal-input-group { position:relative; }
    </style>
</head>
<body>
    <div class="ambient-glow" style="width:500px;height:500px;background:radial-gradient(circle,rgba(0,229,255,0.12) 0%,transparent 70%);top:10%;left:10%;"></div>
    <div class="ambient-glow" style="width:400px;height:400px;background:radial-gradient(circle,rgba(0,230,118,0.08) 0%,transparent 70%);bottom:10%;right:10%;animation-delay:-10s;"></div>

    <!-- 轨道粒子装饰 -->
    <div class="orbit-ring" style="width:200px;height:200px;top:-80px;right:-80px;">
        <div class="orbit-particle" style="top:-2px;left:50%;animation:orbitSpin 12s linear infinite;transform-origin:0 100px;"></div>
    </div>
    <div class="orbit-ring" style="width:140px;height:140px;top:-50px;right:-50px;border-color:rgba(213,0,249,0.15);">
        <div class="orbit-particle purple" style="top:-2px;left:50%;animation:orbitSpin 8s linear infinite reverse;transform-origin:0 70px;"></div>
    </div>
    <style>@keyframes orbitSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}</style>

    <div class="metal-panel">
        <div class="hud-corner tl"></div>
        <div class="hud-corner tr"></div>
        <div class="hud-corner bl"></div>
        <div class="hud-corner br"></div>
        <div class="rivet" style="top:8px;left:8px;"></div>
        <div class="rivet" style="top:8px;right:8px;"></div>
        <div class="rivet" style="bottom:8px;left:8px;"></div>
        <div class="rivet" style="bottom:8px;right:8px;"></div>

        <!-- 头部 -->
        <div class="panel-header">
            <div style="display:flex;align-items:center;justify-content:space-between;">
                <div>
                    <div class="panel-title">⬢ QUANTUM WANDERER</div>
                    <div class="panel-subtitle">星际量子导航终端 v2.0</div>
                </div>
                <div class="led">
                    <span id="geo-status-text" style="color:var(--cyber-red)">定位失败</span>
                    <span id="geo-dot" class="led-light red"></span>
                </div>
            </div>
        </div>

        <div style="padding:20px;">
            <!-- 熵源选择 -->
            <div style="margin-bottom:24px;">
                <label class="metal-label">
                    <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="10" ry="4.2"/><ellipse cx="12" cy="12" rx="10" ry="4.2" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="10" ry="4.2" transform="rotate(120 12 12)"/></svg>
                    ENTROPY SOURCE / 随机熵源
                </label>
                <div id="entropy-list" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
                    <label class="entropy-btn selected" data-card="randomorg">
                        <input type="radio" name="entropy-source" value="randomorg" checked style="position:absolute;opacity:0;">
                        <div style="display:flex;align-items:center;gap:10px;">
                            <span class="led-light blue" data-dot="randomorg" style="flex-shrink:0;"></span>
                            <div style="flex:1;min-width:0;">
                                <div class="entropy-name">大气噪声</div>
                                <div class="source-status status-ready" data-status="randomorg">STANDBY</div>
                            </div>
                        </div>
                    </label>
                    <label class="entropy-btn" data-card="anu">
                        <input type="radio" name="entropy-source" value="anu" style="position:absolute;opacity:0;">
                        <div style="display:flex;align-items:center;gap:10px;">
                            <span class="led-light off dim" data-dot="anu" style="flex-shrink:0;opacity:0.4;"></span>
                            <div style="flex:1;min-width:0;">
                                <div class="entropy-name">量子涨落</div>
                                <div class="source-status status-idle" data-status="anu">OFFLINE</div>
                            </div>
                        </div>
                    </label>
                </div>
                <div id="error-box" class="alert-panel hidden" style="margin-top:12px;"></div>
            </div>

            <!-- 主题输入 -->
            <div style="margin-bottom:20px;">
                <label class="metal-label" for="intent-input">
                    <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                    NAVIGATION INTENT / 漫游主题
                </label>
                <div class="metal-input-group">
                    <input type="text" id="intent-input" class="metal-sunken" placeholder="输入漫游意图...">
                </div>
            </div>

            <!-- 参数行 -->
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px;">
                <div>
                    <label class="metal-label">
                        <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
                        JUMP TYPE / 类型
                    </label>
                    <!-- 自定义下拉：类型 -->
                    <div class="custom-select" id="type-select">
                        <button type="button" class="select-trigger" data-value="attractor">
                            <span class="select-text">吸引点</span>
                            <svg class="select-arrow-svg" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
                        </button>
                        <div class="select-dropdown">
                            <div class="select-option selected" data-value="attractor">吸引点</div>
                            <div class="select-option" data-value="void">虚空点</div>
                            <div class="select-option" data-value="power">能量点</div>
                        </div>
                    </div>
                </div>
                <div>
                    <label class="metal-label">
                        <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                        JUMP RANGE / 距离
                    </label>
                    <!-- 自定义下拉：距离 -->
                    <div class="custom-select" id="radius-select">
                        <button type="button" class="select-trigger" data-value="1000">
                            <span class="select-text">1000米</span>
                            <svg class="select-arrow-svg" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
                        </button>
                        <div class="select-dropdown">
                            <div class="select-option" data-value="500">500米</div>
                            <div class="select-option selected" data-value="1000">1000米</div>
                            <div class="select-option" data-value="1500">1500米</div>
                            <div class="select-option" data-value="2000">2000米</div>
                            <div class="select-option" data-value="3000">3000米</div>
                            <div class="select-option" data-value="4000">4000米</div>
                            <div class="select-option" data-value="5000">5000米</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 主按钮 -->
            <button id="generate-btn" class="metal-btn" disabled>
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                <span id="btn-text">◈ 导航系统未就绪 ◈</span>
            </button>

            <!-- 结果面板 -->
            <div id="result-panel" class="hidden" style="margin-top:24px;">
                <div class="hud-divider" style="margin-bottom:20px;"></div>
                <div class="metal-label" style="margin-bottom:12px;">
                    <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    QUANTUM CALCULATION COMPLETE / 坐标计算完成
                </div>
                <div class="display-screen">
                    <div style="display:flex;align-items:center;">
                        <div style="flex:1;text-align:center;">
                            <div class="data-label">LATITUDE 纬度</div>
                            <div id="target-lat" class="data-value">-</div>
                        </div>
                        <div class="data-divider" style="height:40px;"></div>
                        <div style="flex:1;text-align:center;">
                            <div class="data-label">LONGITUDE 经度</div>
                            <div id="target-lng" class="data-value">-</div>
                        </div>
                        <div class="data-divider" style="height:40px;"></div>
                        <div style="flex:1;text-align:center;">
                            <div class="data-label">DISTANCE 距离</div>
                            <div class="data-value-green"><span id="dist-num">-</span><span style="font-size:0.8rem;margin-left:4px;">M</span></div>
                        </div>
                    </div>
                </div>
                <a id="nav-link" href="#" onclick="return launchBaiduMapNav(event);" class="metal-btn-nav" style="margin-top:12px;">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/></svg>
                    ⬢ ENGAGE BAIDU NAVIGATION / 启动百度导航
                </a>
            </div>
        </div>
    </div>

    <script>
        let currentLat = 39.915;
        let currentLng = 116.404;
        let lastNavUrl = '';
        let geoOk = false;

        // ========== 自定义下拉逻辑 ==========
        function initCustomSelect(selectId, onChangeCallback) {
            const wrapper = document.getElementById(selectId);
            const trigger = wrapper.querySelector('.select-trigger');
            const dropdown = wrapper.querySelector('.select-dropdown');
            const textEl = trigger.querySelector('.select-text');
            const options = wrapper.querySelectorAll('.select-option');
            let currentValue = trigger.dataset.value;

            function closeAllSelects() {
                document.querySelectorAll('.custom-select').forEach(sw => {
                    sw.querySelector('.select-trigger').classList.remove('active');
                    sw.querySelector('.select-dropdown').classList.remove('show');
                });
            }

            trigger.addEventListener('click', (e) => {
                e.stopPropagation();
                const isOpen = dropdown.classList.contains('show');
                closeAllSelects();
                if (!isOpen) {
                    trigger.classList.add('active');
                    dropdown.classList.add('show');
                }
            });

            options.forEach(opt => {
                opt.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const val = opt.dataset.value;
                    const txt = opt.innerText;
                    currentValue = val;
                    textEl.innerText = txt;
                    trigger.dataset.value = val;
                    options.forEach(o => o.classList.remove('selected'));
                    opt.classList.add('selected');
                    closeAllSelects();
                    if (onChangeCallback) onChangeCallback(val);
                });
            });

            return {
                get value() { return currentValue; },
                set value(v) {
                    const opt = wrapper.querySelector(`.select-option[data-value="${v}"]`);
                    if (opt) {
                        currentValue = v;
                        textEl.innerText = opt.innerText;
                        trigger.dataset.value = v;
                        options.forEach(o => o.classList.remove('selected'));
                        opt.classList.add('selected');
                    }
                }
            };
        }

        // 点击外部关闭所有下拉
        document.addEventListener('click', () => {
            document.querySelectorAll('.custom-select').forEach(sw => {
                sw.querySelector('.select-trigger').classList.remove('active');
                sw.querySelector('.select-dropdown').classList.remove('show');
            });
        });

        function refreshGenerateAvailability() {
            const btn = document.getElementById('generate-btn');
            const txt = document.getElementById('btn-text');
            if (!btn || !txt) return;
            btn.disabled = !geoOk;
            txt.innerText = geoOk ? '◈ 启动量子跃迁 ◈' : '◈ 导航系统未就绪 ◈';
        }

        function showError(msg) {
            const box = document.getElementById('error-box');
            if (box) {
                box.innerText = '⚠ SYSTEM ALERT: ' + msg;
                box.classList.remove('hidden');
            }
            document.getElementById('result-panel').classList.add('hidden');
            lastNavUrl = '';
            document.getElementById('nav-link').setAttribute('href', '#');
        }

        function clearError() {
            const box = document.getElementById('error-box');
            if (box) box.classList.add('hidden');
        }

        function setGeoStatus(state) {
            const dot = document.getElementById('geo-dot');
            const txt = document.getElementById('geo-status-text');
            if (!dot || !txt) return;
            dot.classList.remove('off', 'green', 'red', 'orange', 'blue');
            geoOk = (state === 'success');
            if (state === 'success') {
                dot.classList.add('green');
                txt.innerText = '定位已锁定';
                txt.style.color = 'var(--cyber-green)';
            } else if (state === 'fail') {
                dot.classList.add('red');
                txt.innerText = '定位失败';
                txt.style.color = 'var(--cyber-red)';
            } else {
                dot.classList.add('orange');
                txt.innerText = '定位扫描中';
                txt.style.color = 'var(--cyber-orange)';
            }
            refreshGenerateAvailability();
        }

        const SOURCE_STORAGE_KEY = 'quantum-wanderer.entropy-source';
        const VALID_SOURCES = ['randomorg', 'anu'];

        function loadSavedSource() {
            try {
                const v = localStorage.getItem(SOURCE_STORAGE_KEY);
                return VALID_SOURCES.indexOf(v) !== -1 ? v : null;
            } catch (e) { return null; }
        }
        function saveSource(id) { try { localStorage.setItem(SOURCE_STORAGE_KEY, id); } catch(e) {} }

        let currentSource = loadSavedSource() || 'randomorg';
        let generating = false;
        let generationToken = 0;

        function getActiveSource() {
            const el = document.querySelector('input[name="entropy-source"]:checked');
            return el ? el.value : 'randomorg';
        }

        function setSourceStatus(id, state) {
            const dot = document.querySelector('[data-dot="' + id + '"]');
            if (!dot) return;
            const label = { idle:'OFFLINE', ready:'STANDBY', loading:'SYNCING', success:'ONLINE', fail:'ERROR' };
            const map = {
                idle:['off',true], ready:['blue',false], loading:['orange',false], success:['green',false], fail:['red',false]
            };
            const m = map[state] || map.ready;
            dot.classList.remove('off','green','red','orange','blue','dim');
            dot.classList.add(m[0]);
            if (m[1]) dot.classList.add('dim');
            dot.style.opacity = m[1] ? '0.4' : '1';

            const txt = document.querySelector('[data-status="' + id + '"]');
            if (txt) {
                txt.innerText = label[state] || label.ready;
                let c = 'status-idle';
                if (state==='success') c='status-success';
                else if (state==='fail') c='status-error';
                else if (state==='loading') c='status-loading';
                else if (state==='ready') c='status-ready';
                txt.className = 'source-status ' + c;
            }
        }

        function assertActive(id) {
            if (getActiveSource() !== id || currentSource !== id) throw new Error('未选中的熵源被调用');
            setSourceStatus(id, 'loading');
        }
        function markRequestSent() {}

        function onSourceChange(next) {
            if (generating) {
                const el = document.querySelector('input[name="entropy-source"][value="' + currentSource + '"]');
                if (el) el.checked = true;
                return;
            }
            if (next === currentSource) return;
            currentSource = next;
            saveSource(next);
            generationToken++;
            document.querySelectorAll('.entropy-card,.entropy-btn').forEach(card => {
                card.classList.toggle('selected', card.dataset.card === next);
            });
            ['randomorg','anu'].forEach(id => setSourceStatus(id, id===next?'ready':'idle'));
            clearError();
            document.getElementById('result-panel').classList.add('hidden');
            lastNavUrl='';
            document.getElementById('nav-link').setAttribute('href','#');
        }

        (function init(){
            document.querySelectorAll('input[name="entropy-source"]').forEach(radio=>{
                radio.checked = (radio.value === currentSource);
            });
            document.querySelectorAll('.entropy-btn').forEach(card=>{
                card.classList.toggle('selected', card.dataset.card===currentSource);
            });
            VALID_SOURCES.forEach(id=>setSourceStatus(id, id===currentSource?'ready':'idle'));
        })();

        document.querySelectorAll('input[name="entropy-source"]').forEach(radio=>{
            radio.addEventListener('change', ()=>onSourceChange(radio.value));
        });

        function requestGeolocation() {
            if (!navigator.geolocation) { setGeoStatus('fail'); showError('浏览器不支持定位'); return; }
            setGeoStatus('pending');
            navigator.geolocation.getCurrentPosition(
                pos=>{ currentLat=pos.coords.latitude; currentLng=pos.coords.longitude; setGeoStatus('success'); },
                ()=>{ setGeoStatus('fail'); showError('定位失败或被拒绝，请允许浏览器定位后刷新'); },
                { enableHighAccuracy:true, timeout:10000, maximumAge:0 }
            );
        }
        requestGeolocation();

        // ========== 初始化两个自定义下拉 ==========
        const radiusSelect = initCustomSelect('radius-select');
        const pointTypeSelect = initCustomSelect('type-select');
        const btnText = document.getElementById('btn-text');

        const ROAM_KEY = 'quantum-wanderer.roam-config';
        function loadRoam(){
            try{
                const raw=localStorage.getItem(ROAM_KEY); if(!raw)return null;
                const cfg=JSON.parse(raw);
                return {
                    pointType: cfg.pointType || null,
                    radius: cfg.radius || null
                };
            }catch(e){return null;}
        }
        function saveRoam(){
            try{ localStorage.setItem(ROAM_KEY, JSON.stringify({pointType:pointTypeSelect.value,radius:radiusSelect.value})); }catch(e){}
        }
        (function initRoam(){
            const cfg=loadRoam(); if(!cfg)return;
            if(cfg.pointType) pointTypeSelect.value = cfg.pointType;
            if(cfg.radius) radiusSelect.value = cfg.radius;
        })();

        // 自定义下拉值变化时保存
        document.getElementById('type-select').addEventListener('click', () => setTimeout(saveRoam, 0));
        document.getElementById('radius-select').addEventListener('click', () => setTimeout(saveRoam, 0));

        async function sha256(t){return new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)));}

        async function buildDirectPoints(intent,vals){
            const h=await sha256('pairing|'+(intent||''));
            const shift=(((h[0]<<24)|(h[1]<<16)|(h[2]<<8)|h[3])>>>0)%1000;
            const pts=new Array(1000);
            for(let i=0;i<1000;i++)pts[i]=[vals[i],vals[1000+(i+shift)%1000]];
            return pts;
        }

        async function buildAnuState(intent,u16){
            const h=await sha256((intent||'')+'|'+u16.join(','));
            const w=[];
            for(let i=0;i<4;i++){let s=0n;for(let j=0;j<8;j++)s=(s<<8n)|BigInt(h[i*8+j]);w.push(s);}
            return w;
        }

        function murmur(h){h^=h>>>16;h=Math.imul(h,0x85ebca6b);h^=h>>>13;h=Math.imul(h,0xc2b2ae35);h^=h>>>16;return h>>>0;}

        function makePRNG(sw){
            let s=sw.slice(0,4).map(w=>w&0xffffffffffffffffn);
            if(s[0]===0n&&s[1]===0n&&s[2]===0n&&s[3]===0n)s[0]=1n;
            const rot=(x,k)=>((x<<k)|(x>>(64n-k)))&0xffffffffffffffffn;
            return function(){
                const r=(rot((s[1]*5n)&0xffffffffffffffffn,7n)*9n)&0xffffffffffffffffn;
                const t=(s[1]<<17n)&0xffffffffffffffffn;
                s[2]^=s[0];s[3]^=s[1];s[1]^=s[2];s[0]^=s[3];s[2]^=t;s[3]=rot(s[3],45n);
                const hi=Number((r>>32n)&0xffffffffn),lo=Number(r&0xffffffffn);
                return murmur(hi^lo)/4294967296;
            };
        }

        async function fetchRO(){
            assertActive('randomorg');
            const url='https://www.random.org/decimal-fractions/?num=2000&dec=3&col=1&format=plain&rnd=new';
            const ctrl=new AbortController(); const timer=setTimeout(()=>ctrl.abort(),60000);
            let res;
            try{ res=await fetch(url,{signal:ctrl.signal,cache:'no-store'}); }
            catch(e){ setSourceStatus('randomorg','fail'); throw new Error('无法连接RANDOM.ORG: '+e.message); }
            finally{ clearTimeout(timer); }
            if(!res.ok){setSourceStatus('randomorg','fail');throw new Error('RANDOM.ORG HTTP '+res.status);}
            const txt=await res.text();
            const nums=txt.trim().split('\n').map(s=>Number(s.trim()));
            if(nums.length<2000||nums.slice(0,2000).some(n=>!Number.isFinite(n)||n<0||n>1)){
                setSourceStatus('randomorg','fail'); throw new Error('RANDOM.ORG数据格式错误');
            }
            setSourceStatus('randomorg','success');
            return {source:'randomorg',values:nums.slice(0,2000)};
        }

        const ANU_KEY='VPGqExkuVm5gOXBkRNe6o2vfMBQCTYAKamSwN3kE';
        async function fetchANU(){
            assertActive('anu');
            const url='https://api.quantumnumbers.anu.edu.au/?length=32&type=uint16';
            const ctrl=new AbortController(); const timer=setTimeout(()=>ctrl.abort(),10000);
            let res;
            try{ res=await fetch(url,{method:'GET',headers:{'x-api-key':ANU_KEY},signal:ctrl.signal,cache:'no-store'}); }
            catch(e){ setSourceStatus('anu','fail'); throw new Error('无法连接ANU: '+e.message); }
            finally{ clearTimeout(timer); }
            if(!res.ok){setSourceStatus('anu','fail');throw new Error('ANU HTTP '+res.status);}
            let p; try{p=await res.json();}catch(e){setSourceStatus('anu','fail');throw new Error('ANU返回无效JSON');}
            const d=p&&p.data;
            if(!p||p.success===false||!Array.isArray(d)||d.length<32||d.slice(0,32).some(n=>typeof n!=='number'||!Number.isInteger(n)||n<0||n>65535)){
                setSourceStatus('anu','fail'); throw new Error('ANU数据格式错误');
            }
            setSourceStatus('anu','success');
            return {source:'anu',values:d.slice(0,32)};
        }

        async function fetchEntropy(){
            const s=getActiveSource();
            if(s==='randomorg')return await fetchRO();
            if(s==='anu')return await fetchANU();
            throw new Error('未知熵源');
        }

        function launchBaiduMapNav(e){
            if(!lastNavUrl){e.preventDefault();showError('请先生成坐标');return false;}
            window.location.href=lastNavUrl;
            setTimeout(()=>window.open(lastNavUrl.replace('bdapp://map/direction?','https://api.map.baidu.com/direction?'),'_blank'),100);
            return false;
        }
        window.launchBaiduMapNav=launchBaiduMapNav;

        document.getElementById('generate-btn').addEventListener('click',async()=>{
            if(generating||!geoOk)return;
            generating=true; const myT=++generationToken;
            clearError(); document.getElementById('result-panel').classList.add('hidden');
            const btn=document.getElementById('generate-btn'); const txt=document.getElementById('btn-text');
            btn.disabled=true; txt.innerText='◈ QUANTUM CALCULATING... ◈';
            try{
                const intent=document.getElementById('intent-input').value.trim();
                const radius=parseInt(radiusSelect.value,10);
                const mode=pointTypeSelect.value;
                const src=getActiveSource();
                const ent=await fetchEntropy(); if(myT!==generationToken)return;
                let bundle;
                if(ent.source==='randomorg'){
                    const pts=await buildDirectPoints(intent,ent.values);
                    bundle={mode:'direct',points:pts,pc:1000};
                }else{
                    const st=await buildAnuState(intent,ent.values);
                    const prng=makePRNG(st);
                    const pc=Math.min(radius,2000);
                    bundle={mode:'prng',prng,pc};
                }
                const TP=bundle.pc;
                let sumX=0,sumY=0,far=0,close=Infinity,farP=null,closeP=null;
                for(let i=0;i<TP;i++){
                    let r1,r2;
                    if(bundle.mode==='direct'){r1=bundle.points[i][0];r2=bundle.points[i][1];}
                    else{r1=bundle.prng();r2=bundle.prng();}
                    let r,theta;
                    if(mode==='attractor'){r=radius*Math.sqrt(r1);theta=r2*2*Math.PI;}
                    else if(mode==='void'){r=radius*(1-Math.sqrt(r1));theta=r2*2*Math.PI;}
                    else{r=radius*Math.pow(r1,1/3);theta=r2*2*Math.PI;}
                    const x=r*Math.cos(theta),y=r*Math.sin(theta),d=Math.hypot(x,y);
                    if(d>far){far=d;farP={x,y};} if(d<close){close=d;closeP={x,y};}
                    sumX+=x; sumY+=y;
                }
                let tx,ty;
                if(mode==='attractor'){tx=sumX/TP;ty=sumY/TP;}
                else if(mode==='void'){tx=closeP.x;ty=closeP.y;}
                else{tx=farP.x;ty=farP.y;}
                const dLat=tx/111000,dLng=ty/(111000*Math.cos(currentLat*Math.PI/180));
                const tLat=currentLat+dLat,tLng=currentLng+dLng,dist=Math.round(Math.hypot(tx,ty));
                document.getElementById('target-lat').innerText=tLat.toFixed(6);
                document.getElementById('target-lng').innerText=tLng.toFixed(6);
                document.getElementById('dist-num').innerText=dist.toLocaleString();
                const url='bdapp://map/direction?origin='+currentLat+','+currentLng+'&destination='+tLat+','+tLng+'&mode=walking&referer=QW';
                lastNavUrl=url; document.getElementById('nav-link').setAttribute('href',url);
                const p=document.getElementById('result-panel');
                p.classList.remove('hidden'); p.style.animation='none'; p.offsetHeight;
                p.style.animation='resultReveal 0.5s cubic-bezier(0.2,0.8,0.2,1) forwards';
                btn.disabled=false; txt.innerText=geoOk?'◈ 启动量子跃迁 ◈':'◈ 导航系统未就绪 ◈';
            }catch(err){
                if(myT===generationToken){
                    showError(err.message); btn.disabled=!geoOk;
                    txt.innerText=geoOk?'◈ 启动量子跃迁 ◈':'◈ 导航系统未就绪 ◈';
                }
            }finally{ if(myT===generationToken)generating=false; }
        });
        refreshGenerateAvailability();
    </script>
