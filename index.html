    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #030712;
            color: #f8fafc;
            min-height: 100vh;
        }
        .ambient-glow {
            position: absolute;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(6, 182, 212, 0.15) 0%, rgba(59, 130, 246, 0.05) 60%, transparent 100%);
            filter: blur(60px);
            z-index: -1;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }
        .custom-select {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%2394a3b8' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 0.75rem center;
            background-repeat: no-repeat;
            background-size: 1.25rem 1.25rem;
            padding-right: 2.5rem;
        }
        /* 漫游类型 / 漫游距离同一行：写成内联规则，CDN 加载不到时也不会退回上下堆叠 */
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }
        .form-row > div { min-width: 0; }
        .form-row select { width: 100%; box-sizing: border-box; }
        /* 定位状态圆点 */
        .geo-dot {
            width: 12px;
            height: 12px;
            border-radius: 9999px;
            flex-shrink: 0;
            transition: background-color 0.4s ease, box-shadow 0.4s ease;
        }
        .geo-dot.pending {
            background-color: #6b7280; /* 灰色：定位中 */
            box-shadow: 0 0 0 0 rgba(107, 114, 128, 0.5);
        }
        .geo-dot.success {
            background-color: #10b981; /* 绿色：定位成功 */
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
            animation: geoPulse 2s infinite;
        }
        .geo-dot.fail {
            background-color: #ef4444; /* 红色：定位失败 */
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.2);
        }
        @keyframes geoPulse {
            0%   { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.55); }
            70%  { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
        /* Tailwind CDN 未加载时的兜底：隐藏类必须仍然生效 */
        .hidden { display: none !important; }
        /* 熵源卡片：两个框并排，各自独立成框；选中只靠边缘蓝色高亮，不再放选中圆点 */
        .entropy-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.5rem; }
        .entropy-card {
            display: block; position: relative;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 0.75rem;
            padding: 0.75rem;
            cursor: pointer;
            transition: border-color .2s ease, background .2s ease, box-shadow .2s ease;
        }
        .entropy-card:hover { border-color: rgba(148, 163, 184, 0.35); }
        .entropy-card.selected {
            border-color: rgba(34, 211, 238, 0.9);
            background: rgba(8, 145, 178, 0.10);
            box-shadow: inset 0 0 0 1px rgba(34, 211, 238, 0.25), 0 0 0 1px rgba(34, 211, 238, 0.18);
        }
        .entropy-card.locked { pointer-events: none; opacity: 0.55; }
        .entropy-card input[type="radio"] { position: absolute; opacity: 0; width: 0; height: 0; }
        .ec-row { display: flex; align-items: center; gap: 0.625rem; }
        /* 每个框 = 一个状态球 + 名称（左） + 状态文字（右，同一行） */
        .ec-label {
            font-size: 0.8rem; font-weight: 600; color: #e2e8f0;
            line-height: 1.3; white-space: nowrap;
        }
        /* 状态文字占框内右侧空白；按状态配内联色，CDN 加载不到也不掉色 */
        .ec-status {
            margin-left: auto; flex-shrink: 0; white-space: nowrap;
            font-size: 0.625rem; line-height: 1.3; text-align: right;
        }
        .ec-status.idle    { color: #64748b; }
        .ec-status.ready   { color: #94a3b8; }
        .ec-status.loading { color: #38bdf8; }
        .ec-status.success { color: #10b981; }
        .ec-status.fail    { color: #ef4444; }
        /* 未选中的源：状态球压暗，配合蓝框与状态文字一起区分 */
        .geo-dot.dim { opacity: 0.35; }
        .geo-dot.loading:not(.success) {
            background-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
            animation: geoPulseBlue 1.4s infinite;
        }
        @keyframes geoPulseBlue {
            0%   { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.5); }
            70%  { box-shadow: 0 0 0 9px rgba(56, 189, 248, 0); }
            100% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0); }
        }
        /* 成功态：定位球与两个熵源球完全一致 —— 绿色 + 同款 geoPulse 2s 呼吸。
           显式固化并放在 .loading 之后，保证成功时永远是绿色呼吸，不被压暗或盖成蓝色 */
        .geo-dot.success,
        .entropy-list .geo-dot.success {
            background-color: #10b981;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
            opacity: 1;
            animation: geoPulse 2s infinite;
        }
    </style>
</head>

        let currentLat = 39.915;   // 仅占位；定位没成功前绝不允许参与计算
        let currentLng = 116.404;
        let lastNavUrl = '';       // 保存最近一次生成的百度地图唤起链接
        let geoOk = false;         // 定位是否成功；false = 禁止生成

        // 统一维护「生成」按钮。
        // 只有定位失败/未完成时禁用；熵源失败不禁用，否则就没法「点一下明确报错」了。
        function refreshGenerateAvailability() {
            const btn = document.getElementById('generate-btn');
            const txt = document.getElementById('btn-text');
            if (!btn || !txt) return;
            btn.disabled = !geoOk;
            txt.innerText = geoOk ? '生成' : '定位失败，无法生成';
        }

        // 明确报错：隐藏旧结果、清掉旧导航链接，避免拿上一次的结果继续用。
        function showError(msg) {
            const box = document.getElementById('error-box');
            if (box) {
                box.innerText = '⛔ ' + msg;
                box.classList.remove('hidden');
            }
            document.getElementById('result-panel').classList.add('hidden');
            lastNavUrl = '';
            document.getElementById('nav-link').setAttribute('href', '#');
        }

        function clearError() {
            const box = document.getElementById('error-box');
            if (box) box.classList.add('hidden');
        }

        // 切换定位状态圆点：pending(灰) / success(绿) / fail(红)
        function setGeoStatus(state) {
            const dot = document.getElementById('geo-dot');
            const txt = document.getElementById('geo-status-text');
            if (!dot || !txt) return;
            dot.classList.remove('pending', 'success', 'fail');
            dot.classList.add(state);
            geoOk = (state === 'success');
            if (state === 'success') {
                txt.innerText = '已定位';
                txt.className = 'text-xs text-emerald-400';
            } else if (state === 'fail') {
                txt.innerText = '定位失败';
                txt.className = 'text-xs text-red-400';
            } else {
                txt.innerText = '定位中...';
                txt.className = 'text-xs text-gray-400';
            }
            refreshGenerateAvailability();
        }

        // ===== 熵源选择记忆 =====
        // 只存一个字符串（'randomorg' / 'anu'）：不存 API Key、不存主题、不存坐标、不存生成结果。
        // file:// / 隐私模式 / 禁用存储时 localStorage 可能抛异常，全部静默回退到默认源，页面不崩。
        const SOURCE_STORAGE_KEY = 'quantum-wanderer.entropy-source';
        const VALID_SOURCES = ['randomorg', 'anu'];

        function loadSavedSource() {
            try {
                const v = localStorage.getItem(SOURCE_STORAGE_KEY);
                return VALID_SOURCES.indexOf(v) !== -1 ? v : null;
            } catch (e) {
                return null;
            }
        }

        function saveSource(id) {
            try {
                localStorage.setItem(SOURCE_STORAGE_KEY, id);
            } catch (e) {
                // 存储不可用时只影响「下次默认选中」，本次功能完全正常
            }
        }

        // ===== 熵源管理 =====
        // 全局只保留「当前选中源」，所有请求都从 fetchEntropy() 这一个出口分派。
        // 未选中的源：状态固定为「未选中」，其 fetch 函数不会被调用，也不会发出任何网络请求。
        // 打开页面时优先恢复上次选中的源；没有记录（或存储不可用）则用 randomorg。
        let currentSource = loadSavedSource() || 'randomorg';
        let generating = false;
        let generationToken = 0;
        const requestCounts = { randomorg: 0, anu: 0 };

        function getActiveSource() {
            const el = document.querySelector('input[name="entropy-source"]:checked');
            return el ? el.value : 'randomorg';
        }

        // 单个源：状态球（颜色/压暗）+ 框右侧状态文字，两者同步更新。
        // 文案：未选中 / 待生成 / 获取中 / 成功 / 失败。
        function setSourceStatus(id, state) {
            const dot = document.querySelector('[data-dot="' + id + '"]');
            if (!dot) return;
            const label = {
                idle:    '未选中',
                ready:   '待生成',
                loading: '获取中',
                success: '成功',
                fail:    '失败'
            };
            const map = {
                idle:    ['pending', true ],
                ready:   ['pending', false],
                loading: ['loading', false],
                success: ['success', false],
                fail:    ['fail',    false]
            };
            const m = map[state] || map.ready;
            dot.classList.remove('pending', 'loading', 'success', 'fail', 'dim');
            dot.classList.add(m[0]);
            if (m[1]) dot.classList.add('dim');   // 未选中 → 球压暗

            const txt = document.querySelector('[data-status="' + id + '"]');
            if (txt) {
                txt.innerText = label[state] || label.ready;
                txt.className = 'ec-status ' + (state === 'idle' || state === 'ready' ||
                    state === 'loading' || state === 'success' || state === 'fail' ? state : 'ready');
            }
        }

        // 双保险：每个源的 fetch 第一行都过这道闸。
        // 不是当前选中源就直接抛错，连 fetch() 都碰不到。
        function assertActive(id) {
            if (getActiveSource() !== id || currentSource !== id) {
                throw new Error('内部保护：未选中的熵源被尝试调用，已阻止（未发出任何请求）');
            }
            setSourceStatus(id, 'loading');
        }

        // 内部记录「真正发出 fetch」的次数（框内不再展示），便于核对零请求约束
        function markRequestSent(id) {
            requestCounts[id] += 1;
        }

        // 切换熵源：只改 DOM，绝不做任何网络请求。
        // 同时清掉上一次的结果和导航链接，避免拿另一个熵源算出的坐标继续导航。
        function onSourceChange(next) {
            if (generating) {
                const el = document.querySelector('input[name="entropy-source"][value="' + currentSource + '"]');
                if (el) el.checked = true;
                return;
            }
            if (next === currentSource) return;
            currentSource = next;
            saveSource(next);              // 记住本次选择，下次打开就是它
            generationToken += 1;

            document.querySelectorAll('.entropy-card').forEach(card => {
                card.classList.toggle('selected', card.dataset.card === next);
            });
            ['randomorg', 'anu'].forEach(id => {
                setSourceStatus(id, id === next ? 'ready' : 'idle');
            });
            clearError();
            document.getElementById('result-panel').classList.add('hidden');
            lastNavUrl = '';
            document.getElementById('nav-link').setAttribute('href', '#');
        }

        // 初始化：把「上次保存的源」完整同步到 DOM——radio.checked / 蓝框 / 状态球 / 状态文字。
        // 纯本地 DOM 操作，不发任何网络请求；用 JS 改 checked 不会触发 change 事件。
        // 每次打开都是全新的「待生成」，不恢复上次的成功/失败状态。
        (function initEntropySource() {
            document.querySelectorAll('input[name="entropy-source"]').forEach(radio => {
                radio.checked = (radio.value === currentSource);
            });
            document.querySelectorAll('.entropy-card').forEach(card => {
                card.classList.toggle('selected', card.dataset.card === currentSource);
            });
            VALID_SOURCES.forEach(id => {
                setSourceStatus(id, id === currentSource ? 'ready' : 'idle');
            });
        })();

        document.querySelectorAll('input[name="entropy-source"]').forEach(radio => {
            radio.addEventListener('change', () => onSourceChange(radio.value));
        });

        // 浏览器原生定位
        function requestGeolocation() {
            if (!navigator.geolocation) {
                setGeoStatus('fail');
                showError('浏览器不支持定位，已禁止生成。');
                return;
            }
            setGeoStatus('pending');
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    currentLat = position.coords.latitude;
                    currentLng = position.coords.longitude;
                    setGeoStatus('success');
                },
                () => {
                    setGeoStatus('fail');
                    showError('定位失败或被拒绝，已禁止生成。请允许浏览器定位后刷新页面；不会使用默认坐标偷偷计算。');
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }

        // 初始化只做定位。两个熵源都保持初始态、不发任何请求；
        // 只有点「生成」时才现场向「当前选中的那个」取数，另一个始终零请求。
        requestGeolocation();

        // ===== 档位规则 =====
        // 一个点吃 2 个数（r1 定远近、r2 定方向），所以「要几个数」= 点数 × 2。
        // 两个熵源完全一致：所有半径固定 1000 点 / 2000 个数，每次生成只发 1 次请求；
        // 2000 个数全部是真随机原值，全程不经过任何伪随机算法。
        //   RANDOM.ORG：num=2000&dec=3（3 位小数）
        //   ANU：type=hex16 一次取够 2000 个 16 位整数，除以 65536 得到 [0,1) 小数
        const POINT_COUNT = 1000;
        const NUMBER_COUNT = POINT_COUNT * 2;

        function getPointCount() {
            return POINT_COUNT;
        }

        // 下拉框与按钮文案引用
        const radiusSelect = document.getElementById('radius-select');
        const pointTypeSelect = document.getElementById('point-type');
        const btnText = document.getElementById('btn-text');

        function updatePointUIDisplay() {
            btnText.innerText = geoOk ? '生成' : '定位失败，无法生成';
        }

        // ===== 漫游类型 / 漫游距离 选择记忆 =====
        // 两项作为一个组合快照「一起存、一起恢复」：这次选了什么，下次打开还是什么。
        // 只存两个下拉框的 value，不存主题、坐标、生成结果。
        // file:// / 隐私模式 / 禁用存储时 localStorage 可能抛异常，静默回退到页面默认值，页面不崩。
        const ROAM_STORAGE_KEY = 'quantum-wanderer.roam-config';

        // 只认当前页面里真实存在的选项：脏数据、旧版本值一律忽略，不会把下拉框设成空
        function hasOption(select, value) {
            return Array.prototype.some.call(select.options, o => o.value === value);
        }

        function loadSavedRoamConfig() {
            try {
                const raw = localStorage.getItem(ROAM_STORAGE_KEY);
                if (!raw) return null;
                const cfg = JSON.parse(raw);
                return {
                    pointType: cfg && hasOption(pointTypeSelect, cfg.pointType) ? cfg.pointType : null,
                    radius:    cfg && hasOption(radiusSelect,    cfg.radius)    ? cfg.radius    : null
                };
            } catch (e) {
                return null;
            }
        }

        function saveRoamConfig() {
            try {
                localStorage.setItem(ROAM_STORAGE_KEY, JSON.stringify({
                    pointType: pointTypeSelect.value,
                    radius: radiusSelect.value
                }));
            } catch (e) {
                // 存储不可用时只影响「下次默认选项」，本次功能完全正常
            }
        }

        // 初始化：把上次保存的两项选择同步回下拉框；用 JS 改 value 不会触发 change 事件
        (function initRoamConfig() {
            const cfg = loadSavedRoamConfig();
            if (!cfg) return;
            if (cfg.pointType) pointTypeSelect.value = cfg.pointType;
            if (cfg.radius) radiusSelect.value = cfg.radius;
        })();

        // 任一选项变化，都把「类型 + 距离」这一组当前选择整体记下来
        pointTypeSelect.addEventListener('change', saveRoamConfig);
        radiusSelect.addEventListener('change', () => {
            saveRoamConfig();
            updatePointUIDisplay();
        });

        // SHA-256 小工具：任意字符串 → 32 字节
        async function sha256Bytes(text) {
            const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
            return new Uint8Array(buf);
        }

        // 2000 个真随机数 → 1000 个点（RANDOM.ORG 与 ANU 共用）。
        // 前 1000 个定「远近」、后 1000 个定「方向」；主题只决定两列怎么配对，
        // 所有数字原样使用、一个不丢、一个不改，全程不经过任何伪随机算法。
        // 两组各自均匀独立，任意配对后仍均匀独立，统计性质不变。
        async function buildDirectPoints(intentText, values) {
            const h = await sha256Bytes('pairing|' + (intentText || ''));
            const shift = (((h[0] << 24) | (h[1] << 16) | (h[2] << 8) | h[3]) >>> 0) % 1000;
            const pts = new Array(1000);
            for (let i = 0; i < 1000; i++) {
                pts[i] = [values[i], values[1000 + (i + shift) % 1000]];
            }
            return pts;
        }

        // 报错里要给出「具体状态码 + 服务器回了什么」，不然没法判断出了什么事。
        function snip(text, n) {
            n = n || 200;
            const t = String(text == null ? '' : text).replace(/\s+/g, ' ').trim();
            return t.length > n ? t.slice(0, n) + '…' : t;
        }
        async function readSnippet(response, n) {
            try { return snip(await response.text(), n); } catch (e) { return ''; }
        }

        // ---- 源 A：RANDOM.ORG 大气噪声（真随机数直接参与每个点）----
        // num=2000&dec=3：一次取 2000 个 3 位小数 → 1000 个点（每点吃 2 个）。
        // num 固定，不再跟半径变；dec 从 6 降到 3，按 bit 计的配额省一半。
        // 官方建议大块请求给几分钟，故超时从 8 秒提到 60 秒。
        async function fetchRandomOrgEntropy() {
            assertActive('randomorg');           // 不是选中源 → 直接抛错，不发请求
            const url = 'https://www.random.org/decimal-fractions/?num=2000&dec=3&col=1&format=plain&rnd=new';
            const ctrl = new AbortController();
            const timer = setTimeout(() => ctrl.abort(), 60000);
            let response;
            markRequestSent('randomorg');
            try {
                response = await fetch(url, { signal: ctrl.signal, cache: 'no-store' });
            } catch (error) {
                setSourceStatus('randomorg', 'fail');
                throw new Error('无法连接 RANDOM.ORG（未收到任何 HTTP 状态码，多为浏览器跨域限制或网络不可达）：'
                    + (error.name === 'AbortError' ? '请求超时（60 秒无响应）' : error.name + ': ' + error.message));
            } finally {
                clearTimeout(timer);
            }
            if (!response.ok) {
                setSourceStatus('randomorg', 'fail');
                const body = await readSnippet(response);
                throw new Error('RANDOM.ORG 返回 HTTP ' + response.status + (response.statusText ? ' ' + response.statusText : '')
                    + (body ? '，响应内容：' + body : '，响应内容为空'));
            }
            const text = await response.text();
            const numbers = text.trim().split('\n').map(s => Number(s.trim()));
            if (numbers.length < 2000 || numbers.slice(0, 2000).some(n => !Number.isFinite(n) || n < 0 || n > 1)) {
                setSourceStatus('randomorg', 'fail');
                throw new Error('RANDOM.ORG 返回 HTTP ' + response.status + '，但内容不是 2000 个 [0,1] 小数（实际解析出 ' + numbers.length + ' 行）。响应内容：' + (snip(text) || '（空）'));
            }
            setSourceStatus('randomorg', 'success');
            return { source: 'randomorg', values: numbers.slice(0, 2000) };
        }

        // ---- 源 B：ANU Quantum Numbers（澳大利亚国立大学 · 真空量子涨落）----
        // 官方端点：https://api.quantumnumbers.anu.edu.au/
        // 鉴权：请求头 x-api-key；返回 {"success":true,"type":"hex16","length":N,"data":["....", ...]}
        // 与 RANDOM.ORG 同档：一次请求取 2000 个真随机数，原值直接使用，不经任何伪随机算法。
        // 官方限制每次数组最多 1024 项，uint16 凑不够 2000，所以改用 hex16 十六进制块：
        //   type=hex16&length=400&size=10 → 400 个字符串，每个由 size 个数拼成。
        //   把所有字符串首尾相接，每 4 个十六进制字符 = 1 个 16 位整数（0..65535），
        //   取前 2000 个，除以 65536 → [0,1) 小数；多出来的直接丢弃，不影响均匀性。
        //   多要一倍，是为了不管 size 按「16 位数」还是按「字节」计，都至少有 8000 个字符。
        // 多 Key 自动轮换：某个 Key 额度用尽（HTTP 429）或被网关拒绝（403 / 401）时，
        // 本次生成里立刻换下一个 Key 重试，直到取到数据或 10 个 Key 全部不可用。
        // 网络不通 / 超时 / 5xx / 返回内容不对，这些换 Key 也没用，不轮换，直接报错。
        // 会记住上次能用的 Key 序号，下次从它开始，不再先撞一遍已用尽的。
        // 注意：10 个 Key 都写在前端页面里，任何拿到本文件的人都能看到，请勿公开发布此文件。
        const ANU_API_KEYS = [
            'VPGqExkuVm5gOXBkRNe6o2vfMBQCTYAKamSwN3kE',
            'HZhTRVmkuk2afzt6rbjim7BsuF5iqxci8RFtc3Rn',
            'L1utuW8BQi23XlRzKDlMI93y6FsdBpEyaYzAXZwU',
            'BLXzo46wd37KNO5A9senQaaFriQkfHXN2hJdFUQf',
            'XGrJHZsgC04ybqt8uthV89jCApyH8FSG2JHhsSEQ',
            'zQaA18Pr5l1Hq2AAMBYYW8bTSEVsCIhT1AxB8wAB',
            'EVZZ4pU5Ir7f3Ca4sE66z2fu60wlBKiA1uOaUU7P',
            '6WVk5hn17N9zBeqcNFkfMRcEKug7oL1WQVTWkpg0',
            'anPJFgIoxz1u8uYd3wDkO3q59pEwxlPeDQYwjT0b',
            'al2qKcC5dO5WTsTttG1B1GEskqq3ZHI2AsWbP7Ie'
        ];
        const ANU_KEY_STORAGE = 'quantum-wanderer.anu-key-index';
        const ANU_BLOCK_LENGTH = 400;
        const ANU_BLOCK_SIZE = 10;

        let anuKeyIndex = (function () {
            try {
                const n = parseInt(localStorage.getItem(ANU_KEY_STORAGE), 10);
                return Number.isInteger(n) && n >= 0 && n < ANU_API_KEYS.length ? n : 0;
            } catch (e) {
                return 0;   // 存储不可用：每次从第 1 个 Key 开始，功能不受影响
            }
        })();

        function saveAnuKeyIndex() {
            try { localStorage.setItem(ANU_KEY_STORAGE, String(anuKeyIndex)); } catch (e) {}
        }

        async function fetchAnuEntropy() {
            assertActive('anu');                 // 不是选中源 → 直接抛错，不发请求
            const url = 'https://api.quantumnumbers.anu.edu.au/?type=hex16&length=' + ANU_BLOCK_LENGTH + '&size=' + ANU_BLOCK_SIZE;
            const total = ANU_API_KEYS.length;
            const rejected = [];                 // 本次被拒的 Key：序号 + HTTP 状态

            for (let attempt = 0; attempt < total; attempt++) {
                const idx = (anuKeyIndex + attempt) % total;
                const ctrl = new AbortController();
                const timer = setTimeout(() => ctrl.abort(), 10000);
                let response;
                markRequestSent('anu');
                try {
                    response = await fetch(url, { method: 'GET', headers: { 'x-api-key': ANU_API_KEYS[idx] }, signal: ctrl.signal, cache: 'no-store' });
                } catch (error) {
                    setSourceStatus('anu', 'fail');
                    throw new Error('无法连接 ANU 量子熵源（Key #' + (idx + 1) + '，未收到任何 HTTP 状态码）：'
                        + (error.name === 'AbortError' ? '请求超时（10 秒无响应）' : error.name + ': ' + error.message)
                        + '。若控制台提示 CORS / preflight 失败，说明浏览器 OPTIONS 预检未获服务端放行（浏览器侧限制，与 Key 是否填写无关）');
                } finally {
                    clearTimeout(timer);
                }

                // 额度用尽 / Key 被拒：换下一个 Key 再来
                if (response.status === 429 || response.status === 403 || response.status === 401) {
                    const body = await readSnippet(response, 80);
                    rejected.push('Key #' + (idx + 1) + ' → HTTP ' + response.status + (body ? '，' + body : ''));
                    continue;
                }
                if (!response.ok) {
                    setSourceStatus('anu', 'fail');
                    const body = await readSnippet(response);
                    throw new Error('ANU 返回 HTTP ' + response.status + (response.statusText ? ' ' + response.statusText : '')
                        + '（Key #' + (idx + 1) + '），' + (body ? '响应内容：' + body : '响应内容为空'));
                }

                const text = await response.text();
                let payload;
                try {
                    payload = JSON.parse(text);
                } catch (e) {
                    setSourceStatus('anu', 'fail');
                    throw new Error('ANU 返回 HTTP ' + response.status + '，但内容不是合法 JSON（Key #' + (idx + 1) + '，可能是网关错误页或网络被拦截）。响应内容：' + (snip(text) || '（空）'));
                }
                const data = payload && payload.data;
                const hex = (Array.isArray(data) && data.every(x => typeof x === 'string')) ? data.join('') : '';
                const need = NUMBER_COUNT * 4;
                if (!payload || payload.success === false || !/^[0-9a-fA-F]+$/.test(hex) || hex.length < need) {
                    setSourceStatus('anu', 'fail');
                    let reason;
                    if (!payload) reason = '返回内容为空对象';
                    else if (payload.success === false) reason = 'success:false' + (payload.message ? '，message=' + snip(payload.message, 120) : '');
                    else if (!/^[0-9a-fA-F]+$/.test(hex)) reason = 'data 不是十六进制字符串数组';
                    else reason = '只有 ' + hex.length + ' 个十六进制字符，至少需要 ' + need + ' 个';
                    throw new Error('ANU 返回 HTTP ' + response.status + '，但数据不符合预期（Key #' + (idx + 1) + '）：' + reason + '。响应内容：' + (snip(text) || '（空）'));
                }
                const values = new Array(NUMBER_COUNT);
                for (let i = 0; i < NUMBER_COUNT; i++) {
                    values[i] = parseInt(hex.substr(i * 4, 4), 16) / 65536;   // 16 位整数 → [0,1)
                }
                anuKeyIndex = idx;               // 记住这个能用的 Key，下次从它开始
                saveAnuKeyIndex();
                setSourceStatus('anu', 'success');
                return { source: 'anu', values: values };
            }

            setSourceStatus('anu', 'fail');
            throw new Error('ANU 的 ' + total + ' 个 Key 全部不可用（额度已用尽或被网关拒绝）：\n' + rejected.join('\n'));
        }

        // 唯一分派出口：一次生成只调用一个源，另一个函数连被引用都不会发生。
        // 两个源都返回 {source, values}；主题处理与 bundle 构造统一放在生成按钮里。
        async function fetchEntropy() {
            const src = getActiveSource();
            if (src === 'randomorg') return await fetchRandomOrgEntropy();
            if (src === 'anu')       return await fetchAnuEntropy();
            throw new Error('未知的熵源：' + src);
        }

        async function calculateClusterTarget(lat, lng, radius, mode, entropyBundle) {
            // 点数固定 1000（两个熵源一致）；points 数组长度与 pointCount 一致（构造时已保证）。
            const TOTAL_POINTS = entropyBundle.pointCount;
            let points = [];

            for (let i = 0; i < TOTAL_POINTS; i++) {
                // r1/r2 直接是熵源给的真随机原值（RANDOM.ORG 或 ANU），不经过任何 PRNG
                const r1 = entropyBundle.points[i][0];
                const r2 = entropyBundle.points[i][1];
                let r = radius * Math.sqrt(r1);
                let theta = r2 * 2 * Math.PI;

                // x 朝北、y 朝东，单位是「米」。后面所有点间距都用这两个值比，
                // 不再拿经纬度差（度）跟半径（米）混着比。
                const x = r * Math.cos(theta);
                const y = r * Math.sin(theta);

                let deltaLat = x / 111000;
                let deltaLng = y / (111000 * Math.cos(lat * (Math.PI / 180)));

                points.push({
                    lat: lat + deltaLat,
                    lng: lng + deltaLng,
                    distance: r,
                    x: x,
                    y: y
                });
            }

            let targetPoint = points[0];

            // 阈值 0.12R 是米，点间距也统一换算成米，两边终于同一把尺子。
            const checkRadius = radius * 0.12;
            const checkRadiusSq = checkRadius * checkRadius;

            // 返回两点间距的平方（米²）。比较阈值时不用开方，省一半算力。
            function distSq(a, b) {
                const dx = a.x - b.x;
                const dy = a.y - b.y;
                return dx * dx + dy * dy;
            }

            if (mode === 'attractor') {
                // 吸引点：周围 0.12R 内邻居最多的那个点，谁最挤去谁那。
                let maxDensity = -1;
                for (let i = 0; i < points.length; i++) {
                    let neighbors = 0;
                    for (let j = 0; j < points.length; j++) {
                        if (i !== j && distSq(points[i], points[j]) < checkRadiusSq) neighbors++;
                    }
                    if (neighbors > maxDensity) {
                        maxDensity = neighbors;
                        targetPoint = points[i];
                    }
                }
            } else if (mode === 'void') {
                // 虚空点：找「一整圈里最没伴儿」的那片空地。
                // 这次是真的改了挑法，不只是换尺子：
                //   1) 原来只看「最近那一个邻居离多远」，一个孤立点就能骗到冠军；
                //      现在先看检查圈里一共有几个邻居，越少越空，抗偶然。
                //   2) 0.9R 以外的点不参选——站在圆边上天然少一半邻居，不能白捡「孤单」。
                //   3) 邻居数打平时，再用「最近的邻居离多远」分高下。
                const edgeLimit = radius * 0.9;
                let fewestNeighbors = Infinity;
                let bestMinDist = -1;
                let found = false;
                for (let i = 0; i < points.length; i++) {
                    if (points[i].distance > edgeLimit) continue;
                    let neighbors = 0;
                    let minDist = Infinity;
                    for (let j = 0; j < points.length; j++) {
                        if (i === j) continue;
                        const d = Math.sqrt(distSq(points[i], points[j]));
                        if (d < checkRadius) neighbors++;
                        if (d < minDist) minDist = d;
                    }
                    if (!found || neighbors < fewestNeighbors ||
                        (neighbors === fewestNeighbors && minDist > bestMinDist)) {
                        fewestNeighbors = neighbors;
                        bestMinDist = minDist;
                        targetPoint = points[i];
                        found = true;
                    }
                }
                if (!found) targetPoint = points[0];
            } else if (mode === 'power') {
                // 能量点：不贴最外圈、也不杵在圆心，只在 0.35R~0.85R 的中间环带里，
                // 找「汇聚感」最强的点——近处邻居权重大、远处权重小，连续打分。
                // 不再是谁离圆心最远就选谁。
                const inner = radius * 0.35;
                const outer = radius * 0.85;
                let bestEnergy = -1;
                let found = false;
                for (let i = 0; i < points.length; i++) {
                    if (points[i].distance < inner || points[i].distance > outer) continue;
                    let energy = 0;
                    for (let j = 0; j < points.length; j++) {
                        if (i === j) continue;
                        const d2 = distSq(points[i], points[j]);
                        if (d2 < checkRadiusSq) {
                            energy += 1 - Math.sqrt(d2) / checkRadius;
                        }
                    }
                    if (energy > bestEnergy) {
                        bestEnergy = energy;
                        targetPoint = points[i];
                        found = true;
                    }
                }
                if (!found) targetPoint = points[0];
            }

            return targetPoint;
        }

        // 生成“网页端唤起安卓百度地图 App”的步行导航链接。
        // 关键点：
        //   1) 浏览器/网页端必须用 bdapp:// （baidumap:// 是 App 内部 native 协议，网页里点不一定能被识别，
        //      会先落回网页版导航页，需要再点一次才能进 App）。
        //   2) coord_type=wgs84：浏览器定位拿到的是 WGS84 坐标，百度默认按 BD09 处理，
        //      不声明会偏移 500 米以上。
        //   3) name: 后面的中文必须做 URL 编码，否则部分浏览器/百度会解析失败。
        function buildBaiduMapNavUrl(oLat, oLng, dLat, dLng, name) {
            return 'bdapp://map/direction'
                + '?origin=latlng:' + oLat + ',' + oLng + '|name:' + encodeURIComponent('我的位置')
                + '&destination=latlng:' + dLat + ',' + dLng + '|name:' + encodeURIComponent('量子漫游点·' + name)
                + '&mode=walking'
                + '&coord_type=wgs84'
                + '&src=andr.baidu.open.randonaut';
        }

        // 在用户点击手势中直接跳转，一步唤起百度地图 App
        function launchBaiduMapNav(ev) {
            if (ev && ev.preventDefault) ev.preventDefault();
            if (!lastNavUrl) {
                alert('请先点击上方按钮生成漫游目标');
                return false;
            }
            // 直接跳转，不弹出任何确认或兜底提示
            window.location.href = lastNavUrl;
            return false;
        }

        // 点击生成按钮
        document.getElementById('generate-btn').addEventListener('click', async () => {
            // 双保险：定位没成功，绝不拿默认坐标偷偷算。
            if (!geoOk) {
                showError('定位未成功，已禁止生成。请允许浏览器定位后刷新页面。');
                return;
            }

            const btn = document.getElementById('generate-btn');
            btn.disabled = true;
            btnText.innerText = '生成中...';

            try {
                // 硬门槛：每次计算都「现场」向当前选中的那个熵源要一次真随机数。
                // 另一个未选中的源不会被调用、不会发出任何 API 请求。
                // 拿不到就直接报错并中止，不用缓存、不启用任何本地回退。
                generating = true;
                const token = ++generationToken;
                document.querySelectorAll('.entropy-card').forEach(c => c.classList.add('locked'));
                const activeId = currentSource;

                let rawEntropy;
                try {
                    rawEntropy = await fetchEntropy();
                } catch (error) {
                    showError('已中止计算 [' + activeId + ']：' + error.message + '。本工具强制要求真随机熵源，不启用任何本地回退。');
                    return;
                }
                if (token !== generationToken) return;   // 期间切换过源，丢弃过期结果

                // 未选中的源始终保持「未选中」，不因本次成功而改变
                ['randomorg', 'anu'].forEach(id => {
                    if (id !== activeId) setSourceStatus(id, 'idle');
                });

                let radius = parseInt(radiusSelect.value);
                let mode = pointTypeSelect.value;
                let intentText = document.getElementById('intent-input').value;

                // 两个源统一：2000 个真随机数 → 1000 个点；主题只决定配对方式，数字原样使用
                const pointCount = getPointCount();
                const pts = await buildDirectPoints(intentText, rawEntropy.values);
                if (pts.length !== pointCount) throw new Error('点数与固定档位不符，已中止');
                const entropyBundle = { mode: 'direct', source: rawEntropy.source, pointCount, points: pts };

                let target = await calculateClusterTarget(currentLat, currentLng, radius, mode, entropyBundle);

                // 显示精度刻意保留为 2 位（设计如此，请勿改成 6 位）；导航链接仍使用完整精度坐标
                document.getElementById('target-lat').innerText = target.lat.toFixed(2);
                document.getElementById('target-lng').innerText = target.lng.toFixed(2);
                document.getElementById('dist-num').innerText = Math.round(target.distance);

                // 生成直达百度地图 App 的步行导航链接（网页端用 bdapp://）
                const destName = (intentText && intentText.trim()) ? intentText.trim() : '自由漫游';
                lastNavUrl = buildBaiduMapNavUrl(currentLat, currentLng, target.lat, target.lng, destName);
                document.getElementById('nav-link').setAttribute('href', lastNavUrl);

                clearError();
                document.getElementById('result-panel').classList.remove('hidden');
            } catch (error) {
                showError('计算出错，已中止：' + error.message);
            } finally {
                generating = false;
                document.querySelectorAll('.entropy-card').forEach(c => c.classList.remove('locked'));
                // 无论成功还是报错，都别把按钮钉死在「生成中...」
                refreshGenerateAvailability();
            }
        });
    </script>
</body>
</html>
