<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>量子漫游者</title>
    <!-- 引入现代化 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #030712;
            color: #f8fafc;
            min-height: 100vh;
        }
        .ambient-glow {
            position: absolute;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(6, 182, 212, 0.15) 0%, rgba(59, 130, 246, 0.05) 60%, transparent 100%);
            filter: blur(60px);
            z-index: -1;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }
        .custom-select {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%2394a3b8' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 0.75rem center;
            background-repeat: no-repeat;
            background-size: 1.25rem 1.25rem;
            padding-right: 2.5rem;
        }
        /* 漫游类型 / 漫游距离同一行：写成内联规则，CDN 加载不到时也不会退回上下堆叠 */
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }
        .form-row > div { min-width: 0; }
        .form-row select { width: 100%; box-sizing: border-box; }
        /* 定位状态圆点 */
        .geo-dot {
            width: 12px;
            height: 12px;
            border-radius: 9999px;
            flex-shrink: 0;
            transition: background-color 0.4s ease, box-shadow 0.4s ease;
        }
        .geo-dot.pending {
            background-color: #6b7280; /* 灰色：定位中 */
            box-shadow: 0 0 0 0 rgba(107, 114, 128, 0.5);
        }
        .geo-dot.success {
            background-color: #10b981; /* 绿色：定位成功 */
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
            animation: geoPulse 2s infinite;
        }
        .geo-dot.fail {
            background-color: #ef4444; /* 红色：定位失败 */
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.2);
        }
        @keyframes geoPulse {
            0%   { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.55); }
            70%  { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
    </style>
</head>
<body class="flex items-center justify-center p-4 relative overflow-x-hidden">

    <div class="ambient-glow top-10 left-1/4"></div>
    <div class="ambient-glow bottom-10 right-1/4" style="background: radial-gradient(circle, rgba(16, 185, 129, 0.1) 0%, transparent 70%);"></div>

    <div class="w-full max-w-md glass-panel rounded-3xl p-6 md:p-7 space-y-6 relative z-10">

        <!-- 标题头 -->
        <div class="flex items-center justify-between border-b border-slate-800/80 pb-4">
            <div class="space-y-0.5">
                <h1 class="text-lg font-bold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-blue-400 to-indigo-400 flex items-center gap-2">
                    <svg class="w-5 h-5 text-cyan-400 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"/></svg>
                    量子漫游者
                </h1>
            </div>
            <!-- 定位状态指示器 -->
            <div class="flex items-center gap-2" title="定位状态">
                <span id="geo-status-text" class="text-xs text-gray-400">定位中...</span>
                <span id="geo-dot" class="geo-dot pending"></span>
            </div>
        </div>

        <!-- RANDOM.ORG 熵源状态条：只显示结果，不发请求、不提供重试 -->
        <div class="space-y-2">
            <div class="flex items-center gap-2 bg-slate-900/60 border border-slate-800/80 rounded-xl px-3 py-2.5">
                <span id="entropy-dot" class="geo-dot pending"></span>
                <span id="entropy-status-text" class="text-xs text-gray-400 truncate">RANDOM.ORG：未检测</span>
            </div>
            <div id="error-box" class="hidden text-xs leading-relaxed text-red-300 bg-red-950/40 border border-red-900/60 rounded-xl px-3 py-2.5"></div>
        </div>

        <!-- 参数配置区 -->
        <div class="space-y-4">
            <!-- 意图输入框 -->
            <div class="space-y-1.5">
                <label class="block text-xs font-medium text-gray-300 flex items-center gap-1.5">
                    <svg class="w-3.5 h-3.5 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                    漫游主题
                </label>
                <input type="text" id="intent-input" placeholder="输入你想寻找的事物，如：猫、神秘、废墟..."
                    class="w-full bg-slate-900/80 border border-slate-700/80 rounded-xl px-3.5 py-3 text-sm text-gray-200 focus:outline-none focus:border-cyan-400 focus:ring-2 focus:ring-cyan-400/20 placeholder-gray-600 transition-all">
            </div>

            <!-- 漫游类型 + 漫游距离：同一行各占一列 -->
            <div class="grid grid-cols-2 gap-3 form-row">
                <div class="space-y-1.5 min-w-0">
                    <label class="block text-xs font-medium text-gray-300 flex items-center gap-1.5">
                        <svg class="w-3.5 h-3.5 text-cyan-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
                        漫游类型
                    </label>
                    <select id="point-type" class="w-full bg-slate-900/80 border border-slate-700/80 rounded-xl px-3.5 py-3 text-sm text-gray-200 custom-select appearance-none focus:outline-none focus:border-cyan-400 focus:ring-2 focus:ring-cyan-400/20 transition-all cursor-pointer">
                        <option value="attractor">吸引点</option>
                        <option value="void">虚空点</option>
                        <option value="power">能量点</option>
                    </select>
                </div>

                <div class="space-y-1.5 min-w-0">
                    <label class="block text-xs font-medium text-gray-300 flex items-center gap-1.5">
                        <svg class="w-3.5 h-3.5 text-cyan-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                        漫游距离
                    </label>
                    <select id="radius-select" class="w-full bg-slate-900/80 border border-slate-700/80 rounded-xl px-3.5 py-3 text-sm text-gray-200 custom-select appearance-none focus:outline-none focus:border-cyan-400 focus:ring-2 focus:ring-cyan-400/20 transition-all cursor-pointer">
                        <option value="500">500米</option>
                        <option value="1000" selected>1000米</option>
                        <option value="1500">1500米</option>
                        <option value="2000">2000米</option>
                    </select>
                </div>
            </div>

            <!-- 操作按钮 -->
            <button id="generate-btn" class="w-full py-4 px-4 bg-gradient-to-r from-cyan-500 via-blue-600 to-indigo-600 hover:from-cyan-400 hover:to-indigo-500 text-white font-medium rounded-xl shadow-lg shadow-cyan-500/25 transition-all duration-300 flex items-center justify-center space-x-2 active:scale-[0.99] cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:from-cyan-500 disabled:hover:to-indigo-600">
                <svg class="w-5 h-5 text-white/90" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"/></svg>
                <span id="btn-text">生成</span>
            </button>
        </div>

        <!-- 结果展示面板 (初始隐藏) -->
        <div id="result-panel" class="pt-4 border-t border-slate-800/80 hidden space-y-3.5 animate-fadeIn">
            <div class="text-xs font-semibold text-gray-300">
                <span>量子矩阵计算结果：</span>
            </div>
            <div class="bg-slate-900/90 p-3.5 rounded-xl border border-slate-800/80 flex items-center justify-between shadow-inner">
                <div class="flex-1 text-center">
                    <div class="text-[10px] text-gray-500 mb-1">纬度</div>
                    <div id="target-lat" class="text-sm font-mono font-bold text-cyan-300">-</div>
                </div>
                <div class="w-px h-9 bg-slate-800/80"></div>
                <div class="flex-1 text-center">
                    <div class="text-[10px] text-gray-500 mb-1">经度</div>
                    <div id="target-lng" class="text-sm font-mono font-bold text-cyan-300">-</div>
                </div>
                <div class="w-px h-9 bg-slate-800/80"></div>
                <div class="flex-1 text-center">
                    <div class="text-[10px] text-gray-500 mb-1">直线距离</div>
                    <div id="target-emerald" class="text-xl font-bold text-emerald-400 flex items-center justify-center">
                        <span id="dist-num">-</span><span class="text-lg ml-1">米</span>
                    </div>
                </div>
            </div>
            <!-- 百度地图直达跳转按钮（网页端用 bdapp:// 一步唤起 App） -->
            <a id="nav-link" href="#" onclick="return launchBaiduMapNav(event);" class="block w-full text-center py-3.5 px-4 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white text-xs font-semibold rounded-xl transition-all shadow-lg shadow-emerald-600/25 flex items-center justify-center space-x-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/></svg>
                <span>百度地图步行导航</span>
            </a>
        </div>
    </div>

    <!-- 核心算法与逻辑脚本 -->
    <script>
        let currentLat = 39.915;   // 仅占位；定位没成功前绝不允许参与计算
        let currentLng = 116.404;
        let lastNavUrl = '';       // 保存最近一次生成的百度地图唤起链接
        let geoOk = false;         // 定位是否成功；false = 禁止生成

        // 统一维护「生成」按钮。
        // 只有定位失败/未完成时禁用；熵源失败不禁用，否则就没法「点一下明确报错」了。
        function refreshGenerateAvailability() {
            const btn = document.getElementById('generate-btn');
            const txt = document.getElementById('btn-text');
            if (!btn || !txt) return;
            btn.disabled = !geoOk;
            txt.innerText = geoOk ? '生成' : '定位失败，无法生成';
        }

        // 明确报错：隐藏旧结果、清掉旧导航链接，避免拿上一次的结果继续用。
        function showError(msg) {
            const box = document.getElementById('error-box');
            if (box) {
                box.innerText = '⛔ ' + msg;
                box.classList.remove('hidden');
            }
            document.getElementById('result-panel').classList.add('hidden');
            lastNavUrl = '';
            document.getElementById('nav-link').setAttribute('href', '#');
        }

        function clearError() {
            const box = document.getElementById('error-box');
            if (box) box.classList.add('hidden');
        }

        // 切换定位状态圆点：pending(灰) / success(绿) / fail(红)
        function setGeoStatus(state) {
            const dot = document.getElementById('geo-dot');
            const txt = document.getElementById('geo-status-text');
            if (!dot || !txt) return;
            dot.classList.remove('pending', 'success', 'fail');
            dot.classList.add(state);
            geoOk = (state === 'success');
            if (state === 'success') {
                txt.innerText = '已定位';
                txt.className = 'text-xs text-emerald-400';
            } else if (state === 'fail') {
                txt.innerText = '定位失败';
                txt.className = 'text-xs text-red-400';
            } else {
                txt.innerText = '定位中...';
                txt.className = 'text-xs text-gray-400';
            }
            refreshGenerateAvailability();
        }

        // 切换 RANDOM.ORG 熵源状态：pending / success / fail
        // 状态条只报「成没成」，不展示拿到的具体数值。
        function setEntropyStatus(state) {
            const dot = document.getElementById('entropy-dot');
            const txt = document.getElementById('entropy-status-text');
            if (!dot || !txt) return;
            dot.classList.remove('pending', 'success', 'fail');
            dot.classList.add(state);
            if (state === 'success') {
                txt.innerText = 'RANDOM.ORG：获取成功';
                txt.className = 'text-xs text-emerald-400';
            } else if (state === 'fail') {
                txt.innerText = 'RANDOM.ORG：获取失败';
                txt.className = 'text-xs text-red-400';
            } else {
                txt.innerText = 'RANDOM.ORG：获取中...';
                txt.className = 'text-xs text-gray-400';
            }
        }

        // 浏览器原生定位
        function requestGeolocation() {
            if (!navigator.geolocation) {
                setGeoStatus('fail');
                showError('浏览器不支持定位，已禁止生成。');
                return;
            }
            setGeoStatus('pending');
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    currentLat = position.coords.latitude;
                    currentLng = position.coords.longitude;
                    setGeoStatus('success');
                },
                () => {
                    setGeoStatus('fail');
                    showError('定位失败或被拒绝，已禁止生成。请允许浏览器定位后刷新页面；不会使用默认坐标偷偷计算。');
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }

        // 初始化只做定位。熵源状态条保持「未检测」，
        // 不发任何请求；只有点「生成」时才现场去 RANDOM.ORG 取数。
        requestGeolocation();

        // 监听下拉框改变，动态更新按钮文案
        const radiusSelect = document.getElementById('radius-select');
        const btnText = document.getElementById('btn-text');

        function updatePointUIDisplay() {
            btnText.innerText = geoOk ? '生成' : '定位失败，无法生成';
        }
        radiusSelect.addEventListener('change', updatePointUIDisplay);

        // 空意图时也用本次 RANDOM.ORG 的另外两个数派生种子，
        // 整页不再有任何本地随机源。
        async function hashIntentToSeed(intent, entropy) {
            if (!intent || intent.trim() === "") {
                return Math.floor((entropy[2] * 1000000 + entropy[3] * 1000000) % 2147483647);
            }
            const msgBuffer = new TextEncoder().encode(intent);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            let seed = (hashArray[0] << 24) | (hashArray[1] << 16) | (hashArray[2] << 8) | hashArray[3];
            return Math.abs(seed);
        }

        function murmurHash3Finalizer(h) {
            h ^= h >>> 16;
            h = Math.imul(h, 0x85ebca6b);
            h ^= h >>> 13;
            h = Math.imul(h, 0xc2b2ae35);
            h ^= h >>> 16;
            return h >>> 0;
        }

        function splitmix64(state) {
            state = (state + 0x9e3779b97f4a7c15n) & 0xffffffffffffffffn;
            let z = state;
            z = ((z ^ (z >> 30n)) * 0xbf58476d1ce4e5b9n) & 0xffffffffffffffffn;
            z = ((z ^ (z >> 27n)) * 0x94d049bb133111ebn) & 0xffffffffffffffffn;
            return [z ^ (z >> 31n), state];
        }

        function createEnhancedPRNG(seedNumber) {
            let smState = BigInt(seedNumber);
            let s = [0n, 0n, 0n, 0n];
            for (let i = 0; i < 4; i++) {
                let res = splitmix64(smState);
                s[i] = res[0];
                smState = res[1];
            }
            if (s[0] === 0n && s[1] === 0n && s[2] === 0n && s[3] === 0n) {
                s[0] = 1n;
            }

            function rotl(x, k) {
                return ((x << k) | (x >> (64n - k))) & 0xffffffffffffffffn;
            }

            return function() {
                const result = (rotl((s[1] * 5n) & 0xffffffffffffffffn, 7n) * 9n) & 0xffffffffffffffffn;
                const t = (s[1] << 17n) & 0xffffffffffffffffn;

                s[2] ^= s[0];
                s[3] ^= s[1];
                s[1] ^= s[2];
                s[0] ^= s[3];

                s[2] ^= t;
                s[3] = rotl(s[3], 45n);

                let high32 = Number((result >> 32n) & 0xffffffffn);
                let low32 = Number(result & 0xffffffffn);

                let mixedValue = murmurHash3Finalizer(high32 ^ low32);

                return mixedValue / 4294967296;
            };
        }

        // 强制从 RANDOM.ORG 取真随机数：拿不到就抛错，不设任何本地回退。
        // Decimal Fractions 接口返回的是 [0,1] 区间的小数（num=4&dec=6&format=plain）。
        async function fetchAtmosphericEntropy() {
            const url = 'https://www.random.org/decimal-fractions/?num=4&dec=6&col=1&format=plain&rnd=new';
            const ctrl = new AbortController();
            const timer = setTimeout(() => ctrl.abort(), 8000);
            let response;
            try {
                response = await fetch(url, { signal: ctrl.signal, cache: 'no-store' });
            } catch (error) {
                throw new Error('无法连接 RANDOM.ORG（多为浏览器跨域限制或网络不可达）：' + error.message);
            } finally {
                clearTimeout(timer);
            }
            if (!response.ok) throw new Error('RANDOM.ORG 返回 HTTP ' + response.status);
            const text = await response.text();
            const numbers = text.trim().split('\n').map(s => Number(s.trim()));
            if (numbers.length < 4 || numbers.slice(0, 4).some(n => !Number.isFinite(n) || n < 0 || n > 1)) {
                throw new Error('RANDOM.ORG 返回内容不是 4 个 [0,1] 小数，已拒绝使用');
            }
            return numbers.slice(0, 4);
        }

        async function calculateClusterTarget(lat, lng, radius, mode, intentSeed, entropy) {
            let combinedSeed = Math.floor((entropy[0] * 1000000 + entropy[1] * 1000000 + intentSeed) % 2147483647);
            let prng = createEnhancedPRNG(combinedSeed);

            let points = [];
            const TOTAL_POINTS = radius;

            for (let i = 0; i < TOTAL_POINTS; i++) {
                let r1 = prng();
                let r2 = prng();
                let r = radius * Math.sqrt(r1);
                let theta = r2 * 2 * Math.PI;

                // x 朝北、y 朝东，单位是「米」。后面所有点间距都用这两个值比，
                // 不再拿经纬度差（度）跟半径（米）混着比。
                const x = r * Math.cos(theta);
                const y = r * Math.sin(theta);

                let deltaLat = x / 111000;
                let deltaLng = y / (111000 * Math.cos(lat * (Math.PI / 180)));

                points.push({
                    lat: lat + deltaLat,
                    lng: lng + deltaLng,
                    distance: r,
                    x: x,
                    y: y
                });
            }

            let targetPoint = points[0];

            // 阈值 0.12R 是米，点间距也统一换算成米，两边终于同一把尺子。
            const checkRadius = radius * 0.12;
            const checkRadiusSq = checkRadius * checkRadius;

            // 返回两点间距的平方（米²）。比较阈值时不用开方，省一半算力。
            function distSq(a, b) {
                const dx = a.x - b.x;
                const dy = a.y - b.y;
                return dx * dx + dy * dy;
            }

            if (mode === 'attractor') {
                // 吸引点：周围 0.12R 内邻居最多的那个点，谁最挤去谁那。
                let maxDensity = -1;
                for (let i = 0; i < points.length; i++) {
                    let neighbors = 0;
                    for (let j = 0; j < points.length; j++) {
                        if (i !== j && distSq(points[i], points[j]) < checkRadiusSq) neighbors++;
                    }
                    if (neighbors > maxDensity) {
                        maxDensity = neighbors;
                        targetPoint = points[i];
                    }
                }
            } else if (mode === 'void') {
                // 虚空点：找「一整圈里最没伴儿」的那片空地。
                // 这次是真的改了挑法，不只是换尺子：
                //   1) 原来只看「最近那一个邻居离多远」，一个孤立点就能骗到冠军；
                //      现在先看检查圈里一共有几个邻居，越少越空，抗偶然。
                //   2) 0.9R 以外的点不参选——站在圆边上天然少一半邻居，不能白捡「孤单」。
                //   3) 邻居数打平时，再用「最近的邻居离多远」分高下。
                const edgeLimit = radius * 0.9;
                let fewestNeighbors = Infinity;
                let bestMinDist = -1;
                let found = false;
                for (let i = 0; i < points.length; i++) {
                    if (points[i].distance > edgeLimit) continue;
                    let neighbors = 0;
                    let minDist = Infinity;
                    for (let j = 0; j < points.length; j++) {
                        if (i === j) continue;
                        const d = Math.sqrt(distSq(points[i], points[j]));
                        if (d < checkRadius) neighbors++;
                        if (d < minDist) minDist = d;
                    }
                    if (!found || neighbors < fewestNeighbors ||
                        (neighbors === fewestNeighbors && minDist > bestMinDist)) {
                        fewestNeighbors = neighbors;
                        bestMinDist = minDist;
                        targetPoint = points[i];
                        found = true;
                    }
                }
                if (!found) targetPoint = points[0];
            } else if (mode === 'power') {
                // 能量点：不贴最外圈、也不杵在圆心，只在 0.35R~0.85R 的中间环带里，
                // 找「汇聚感」最强的点——近处邻居权重大、远处权重小，连续打分。
                // 不再是谁离圆心最远就选谁。
                const inner = radius * 0.35;
                const outer = radius * 0.85;
                let bestEnergy = -1;
                let found = false;
                for (let i = 0; i < points.length; i++) {
                    if (points[i].distance < inner || points[i].distance > outer) continue;
                    let energy = 0;
                    for (let j = 0; j < points.length; j++) {
                        if (i === j) continue;
                        const d2 = distSq(points[i], points[j]);
                        if (d2 < checkRadiusSq) {
                            energy += 1 - Math.sqrt(d2) / checkRadius;
                        }
                    }
                    if (energy > bestEnergy) {
                        bestEnergy = energy;
                        targetPoint = points[i];
                        found = true;
                    }
                }
                if (!found) targetPoint = points[0];
            }

            return targetPoint;
        }

        // 生成“网页端唤起安卓百度地图 App”的步行导航链接。
        // 关键点：
        //   1) 浏览器/网页端必须用 bdapp:// （baidumap:// 是 App 内部 native 协议，网页里点不一定能被识别，
        //      会先落回网页版导航页，需要再点一次才能进 App）。
        //   2) coord_type=wgs84：浏览器定位拿到的是 WGS84 坐标，百度默认按 BD09 处理，
        //      不声明会偏移 500 米以上。
        //   3) name: 后面的中文必须做 URL 编码，否则部分浏览器/百度会解析失败。
        function buildBaiduMapNavUrl(oLat, oLng, dLat, dLng, name) {
            return 'bdapp://map/direction'
                + '?origin=latlng:' + oLat + ',' + oLng + '|name:' + encodeURIComponent('我的位置')
                + '&destination=latlng:' + dLat + ',' + dLng + '|name:' + encodeURIComponent('量子漫游点·' + name)
                + '&mode=walking'
                + '&coord_type=wgs84'
                + '&src=andr.baidu.open.randonaut';
        }

        // 在用户点击手势中直接跳转，一步唤起百度地图 App
        function launchBaiduMapNav(ev) {
            if (ev && ev.preventDefault) ev.preventDefault();
            if (!lastNavUrl) {
                alert('请先点击上方按钮生成漫游目标');
                return false;
            }
            // 直接跳转，不弹出任何确认或兜底提示
            window.location.href = lastNavUrl;
            return false;
        }

        // 点击生成按钮
        document.getElementById('generate-btn').addEventListener('click', async () => {
            // 双保险：定位没成功，绝不拿默认坐标偷偷算。
            if (!geoOk) {
                showError('定位未成功，已禁止生成。请允许浏览器定位后刷新页面。');
                return;
            }

            const btn = document.getElementById('generate-btn');
            btn.disabled = true;
            btnText.innerText = '生成中...';

            try {
                // 硬门槛：每次计算都现场向 RANDOM.ORG 要一次真随机数。
                // 拿不到就直接报错并中止，不用缓存、不启用任何本地回退。
                let entropy;
                setEntropyStatus('pending');
                try {
                    entropy = await fetchAtmosphericEntropy();
                    setEntropyStatus('success');
                } catch (error) {
                    setEntropyStatus('fail');
                    showError('已中止计算：' + error.message + '。本工具强制要求 RANDOM.ORG 真随机数，不启用任何本地回退。');
                    return;
                }

                let radius = parseInt(radiusSelect.value);
                let mode = document.getElementById('point-type').value;
                let intentText = document.getElementById('intent-input').value;

                let intentSeed = await hashIntentToSeed(intentText, entropy);
                let target = await calculateClusterTarget(currentLat, currentLng, radius, mode, intentSeed, entropy);

                document.getElementById('target-lat').innerText = target.lat.toFixed(2);
                document.getElementById('target-lng').innerText = target.lng.toFixed(2);
                document.getElementById('dist-num').innerText = Math.round(target.distance);

                // 生成直达百度地图 App 的步行导航链接（网页端用 bdapp://）
                const destName = (intentText && intentText.trim()) ? intentText.trim() : '自由漫游';
                lastNavUrl = buildBaiduMapNavUrl(currentLat, currentLng, target.lat, target.lng, destName);
                document.getElementById('nav-link').setAttribute('href', lastNavUrl);

                clearError();
                document.getElementById('result-panel').classList.remove('hidden');
            } catch (error) {
                showError('计算出错，已中止：' + error.message);
            } finally {
                // 无论成功还是报错，都别把按钮钉死在「生成中...」
                refreshGenerateAvailability();
            }
        });
    </script>
</body>
</html>
